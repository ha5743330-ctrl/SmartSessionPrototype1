<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Intelligence | SmartSession Pro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  --neon-cyan: #00ffcc;
  --neon-blue: #00e5ff;
  --danger: #ff4d4f;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.1);
  --bg-dark: #0a0a0f;
}

body {
  margin: 0; font-family: 'Inter', sans-serif;
  background: var(--bg-dark) url('/images/background-img.jpg') center/cover no-repeat fixed;
  background-blend-mode: overlay; color: #e1e1e6; min-height: 100vh;
  display: flex; flex-direction: column; overflow-x: hidden;
}

/* --- Premium Navbar --- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-img { height: 40px; width: auto; }
    nav ul { list-style: none; display: flex; margin: 0px 40px 0px 0px; padding: 0; transition: 0.3s; }
    nav ul li { margin: 0 15px; }
    nav ul li a { color: #101699; text-decoration: none; font-weight: 500; transition: 0.3s; }
    nav ul li a:hover { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 28px;
      height: 20px;
      justify-content: space-between;
    }
    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }
/* --- Main Container --- */
.container {
  margin: 110px auto 60px; width: 94%; max-width: 1350px;
  background: var(--glass); padding: 40px; border-radius: 30px;
  backdrop-filter: blur(40px); border: 1px solid var(--border);
  box-shadow: 0 40px 100px rgba(0,0,0,0.6);
}

/* --- Action Header --- */
.header-actions {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 30px; flex-wrap: wrap; gap: 20px;
}
.title-group h1 { font-family: 'Poppins', sans-serif; font-size: 34px; margin: 0; color: var(--neon-cyan); }
.title-group p { color: #777; margin: 5px 0 0; font-size: 14px; }

.search-filter-row {
  display: flex; gap: 15px; width: 100%; margin: 25px 0; align-items: center;
}
.search-input-wrapper { position: relative; flex: 1; }
.search-input-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--neon-cyan); }
.search-input-wrapper input {
  width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
  padding: 14px 14px 14px 50px; border-radius: 12px; color: white; outline: none;
  transition: 0.3s; font-size: 14px;
}
.search-input-wrapper input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,204,0.1); }

/* --- Table Styles --- */
.data-card { background: rgba(0,0,0,0.25); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { background: rgba(255,255,255,0.03); padding: 20px; text-align: left; color: var(--neon-cyan); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
td { padding: 18px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* --- Badges --- */
.badge { padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; border: 1px solid transparent; }
.badge-live { background: rgba(0, 255, 204, 0.1); color: var(--neon-cyan); border-color: rgba(0, 255, 204, 0.2); }
.badge-archived { background: rgba(255, 255, 255, 0.05); color: #888; border-color: var(--border); }

/* --- Action Buttons --- */
.btn-group { display: flex; gap: 10px; }
.btn { 
    padding: 10px 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: white; font-weight: 600; font-size: 13px;
    transition: 0.3s; display: flex; align-items: center; gap: 8px;
}
.btn:hover { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
.btn-danger { color: var(--danger); border-color: rgba(255, 77, 79, 0.2); }
.btn-danger:hover { background: var(--danger); color: white; }

/* --- Bulk Actions Bar (Sticky) --- */
#bulkActionsBar {
  display: none; background: #fff; color: #000; padding: 15px 30px;
  border-radius: 15px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  z-index: 2000; width: 90%; max-width: 600px; justify-content: space-between;
  align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes slideUp { from { bottom: -100px; } to { bottom: 30px; } }

/* --- Toast --- */
#toast {
  position: fixed; top: 100px; right: 30px; background: var(--neon-cyan); color: #000;
  padding: 15px 25px; border-radius: 10px; font-weight: 700; display: none; z-index: 2100;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
    @media (max-width: 900px) {
      nav ul {
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
      }
      nav ul.active { max-height: 500px; padding: 10px 0; }
      nav ul li { margin: 15px 0; }
      .menu-icon { display: flex; margin: 0px 40px 0px 0px; }
    }
    .menu-icon.active div:nth-child(1) { transform: rotate(45deg) translateY(8px); }
    .menu-icon.active div:nth-child(2) { opacity: 0; }
    .menu-icon.active div:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }
      nav ul li a:hover, nav ul li a.active { color: var(--white); border-bottom: 2px solid var(--accent-red); }
</style>
</head>

<body>

     <!-- Navbar -->
  <nav>
    <div class="logo">
      <img src="/images/logo1.png" class="logo-img">
    </div>
    <div class="menu-icon" id="menu-icon">
      <div></div><div></div><div></div>
    </div>
    <ul id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signin">Sign In</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/join-session">Join Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="/settings" class="nav-settings">Settings</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

<div class="container">
  <div class="header-actions">
    <div class="title-group">
      <h1>Data Archives</h1>
      <p>Management portal for all historical and active collaboration sessions.</p>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="exportToCSV()"><i class="fas fa-download"></i> Export CSV</button>
      <button class="btn" onclick="fetchSessions()"><i class="fas fa-sync"></i> Refresh</button>
    </div>
  </div>

  <div class="search-filter-row">
    <div class="search-input-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Quick find by name, ID, or status...">
    </div>
  </div>

  <div class="data-card">
    <table id="sessionTableMain">
      <thead>
        <tr>
          <th style="width: 40px;"><input type="checkbox" id="masterCheckbox" style="accent-color: var(--neon-cyan)"></th>
          <th>Session Identity</th>
          <th>State</th>
          <th>Launch Date</th>
          <th style="text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="sessionsTableBody">
        </tbody>
    </table>
  </div>
</div>

<div id="bulkActionsBar">
    <span style="font-weight: 800;"><i class="fas fa-check-double"></i> <span id="selectedCount">0</span> Sessions Selected</span>
    <button class="btn btn-danger" onclick="deleteSelected()"><i class="fas fa-trash-alt"></i> Delete Selected</button>
</div>

<div id="toast"></div>

<script>
let allSessions = [];

// --- Fetch & Render ---
async function fetchSessions() {
  const tbody = document.getElementById('sessionsTableBody');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:100px; opacity:0.3;"><i class="fas fa-cog fa-spin fa-2x"></i></td></tr>';
  
  try {
    const res = await fetch('/api/view-sessions');
    if(res.status === 401) return window.location.href='/signin';
    allSessions = await res.json();
    renderData(allSessions);
  } catch (err) {
    showToast("System Link Error");
  }
}

function renderData(data) {
  const tbody = document.getElementById('sessionsTableBody');
  tbody.innerHTML = '';

  if(data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:80px; color:#555;">No records found in database.</td></tr>';
    return;
  }

  data.forEach(s => {
    const date = new Date(s.createdAt).toLocaleString('en-US', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="checkbox" class="row-checkbox" data-id="${s._id}" onchange="syncUI()"></td>
      <td>
        <div style="font-weight:700; color:#fff;">${s.sessionName || 'Cloud_Session'}</div>
        <div style="font-size:11px; opacity:0.4; font-family:monospace;">UID: ${s._id}</div>
      </td>
      <td><span class="badge ${s.active ? 'badge-live' : 'badge-archived'}">${s.active ? '● LIVE' : 'ARCHIVED'}</span></td>
      <td style="font-size:13px; color:#999;">${date}</td>
      <td style="text-align: right;">
        <button class="btn btn-danger" onclick="deleteSession('${s._id}')" style="padding: 6px 12px;"><i class="fas fa-trash"></i></button>
      </td>
    `;
    tbody.appendChild(row);
  });
  syncUI();
}

// --- Multi-Delete Logic (FIXED) ---
const masterCb = document.getElementById('masterCheckbox');
masterCb.onclick = (e) => {
    document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = e.target.checked);
    syncUI();
};

function syncUI() {
    const checked = document.querySelectorAll('.row-checkbox:checked');
    const bar = document.getElementById('bulkActionsBar');
    const count = document.getElementById('selectedCount');
    
    if(checked.length > 0) {
        bar.style.display = 'flex';
        count.innerText = checked.length;
    } else {
        bar.style.display = 'none';
        masterCb.checked = false;
    }
}

async function deleteSelected() {
    const ids = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.dataset.id);
    if(!confirm(`Permanent Wipe: Delete ${ids.length} records from servers?`)) return;

    try {
        const res = await fetch('/api/delete-session', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ sessionIds: ids }) // Backend expect 'sessionIds' as array
        });
        
        if(res.ok) {
            showToast(`Successfully deleted ${ids.length} records`);
            fetchSessions();
        }
    } catch (e) { showToast("Batch Delete Failed"); }
}

async function deleteSession(id) {
    if(!confirm("Erase this session from history?")) return;
    await fetch('/api/delete-session', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ sessionId: id })
    });
    showToast("Session Erased");
    fetchSessions();
}

// --- Search Implementation ---
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allSessions.filter(s => 
        (s.sessionName || "").toLowerCase().includes(term) || 
        s._id.toLowerCase().includes(term)
    );
    renderData(filtered);
});

// --- Export CSV ---
function exportToCSV() {
    const rows = [["ID", "Name", "Status", "Date"]];
    allSessions.forEach(s => rows.push([s._id, s.sessionName, s.active ? "Live" : "Archived", s.createdAt]));
    let csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Session_Report.csv");
    document.body.appendChild(link);
    link.click();
}

function showToast(text) {
    const t = document.getElementById('toast');
    t.innerText = text;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

// Initial Load
fetchSessions();
    // --- 8. Logout & Navbar ---
    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/";
    };

    const menuIcon = document.getElementById('menu-icon');
    const navLinks = document.getElementById('nav-links');
    menuIcon.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        menuIcon.classList.toggle('active');
    });

</script>
</body>
</html>
