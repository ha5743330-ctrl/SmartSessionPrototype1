<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Sessions</title>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-image: url('/images/background-img.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: rgba(0,0,0,0.5);
  background-blend-mode: overlay;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: auto;
}
    /* ---------- NAVBAR ---------- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }

.logo {
  display: flex;
  align-items: center; /* vertically center */
  gap: 8px; /* text aur image ke beech spacing */
}

.logo-img {
  height: 40px; /* apni requirement ke mutabiq adjust karein */
  width: auto;
}


    nav ul {
      list-style: none;
      display: flex;
      margin: 0px 40px 0px 0px;
      padding: 0;
      transition: all 0.3s ease;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: #101699;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
    }

    /* --- Hamburger icon --- */
    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 25px;
      height: 20px;
      justify-content: space-between;
    }

    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }
.container {
  margin-top: 120px;
  background: rgba(255,255,255,0.05);
  padding: 40px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  /* box-shadow: 0 0 20px #00ffcc; */
  width: 80%;
  max-width: 900px;
        clip-path: polygon(0 0, 100% 10%, 95% 100%, 5% 95%);

}
h1 { text-align: center; color: #00ffcc; margin-bottom: 20px; }

table {
  width: 100%;
  border-collapse: collapse;
  color: white;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  text-align: center;
}
th { color: #00ffcc; }
tr:hover { background: rgba(0,255,204,0.1); }

button {
  padding: 8px 15px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  margin: 5px;
}
.deleteBtn { background-color: #ff4d4f; color: white; }
.deleteBtn:hover { background-color: #ff7875; }

footer {
  width: 100%;
  background: rgba(0,0,0,0.7);
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 14px;
  margin-top: auto; /* magic line */
}
#selectAllContainer {
  margin-bottom: 10px;
  text-align: left;
}
    /* ---------- Responsive Styles ---------- */
    @media (max-width: 900px) {
      nav ul {
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
      }

      nav ul.active {
        max-height: 500px;
        padding: 10px 0;
      }

      nav ul li {
        margin: 15px 0;
      }

      .menu-icon {
        display: flex;
        margin: 0px 40px 0px 0px;
      }
    }

    /* --- Animation for menu open/close --- */
    .menu-icon.active div:nth-child(1) {
      transform: rotate(45deg) translateY(8px);
    }
    .menu-icon.active div:nth-child(2) {
      opacity: 0;
    }
    .menu-icon.active div:nth-child(3) {
      transform: rotate(-45deg) translateY(-8px);
    }
    /* Table slider for small screens */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
}

/* Table minimum width so columns don't break */
table {
  min-width: 700px;
}

/* Smooth scrollbar (optional, looks premium) */
.table-wrapper::-webkit-scrollbar {
  height: 6px;
}

.table-wrapper::-webkit-scrollbar-thumb {
  background: #00ffcc;
  border-radius: 10px;
}

.table-wrapper::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.1);
}

</style>
</head>

<body>

   <!-- Navbar -->
  <nav>
<div class="logo">
  <img src="/images/logo1.png" alt="SmartSession Logo" class="logo-img">
</div> 
    <div class="menu-icon" id="menu-icon">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <ul id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signin">Sign In</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/join-session">Join Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>


<!-- CONTENT -->
<div class="container">
  <h1>My Sessions</h1>

  <div id="selectAllContainer">
    <input type="checkbox" id="selectAll"> Select All
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>Session ID</th>
          <th>Title</th>
          <th>Status</th>
          <th>Start Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="sessionsTable">
        <tr>
          <td colspan="6">Loading sessions...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button id="deleteSelectedBtn" class="deleteBtn">
    Delete Selected
  </button>
</div>


<footer>
  © 2025 SmartSession Management | All Rights Reserved
</footer>

<script>
async function loadSessions() {
  try {
    const res = await fetch('/api/view-sessions');
    if(res.status === 401){ 
      alert("Please login first"); 
      window.location.href='/signin'; 
      return; 
    }

    const sessions = await res.json();
    const table = document.getElementById('sessionsTable');
    table.innerHTML = '';

    if(sessions.length === 0){
      table.innerHTML = `<tr><td colspan="6">No sessions found</td></tr>`;
      return;
    }

    sessions.forEach(session => {
      table.innerHTML += `
        <tr>
          <td><input type="checkbox" class="selectSession" data-id="${session._id}"></td>
          <td>${session._id}</td>
          <td>${session.sessionName || session.title}</td>
          <td>${session.active ? 'Active' : 'Inactive'}</td>
          <td>${new Date(session.createdAt).toLocaleString()}</td>
          <td>
            <button class="deleteBtn" data-id="${session._id}">Delete</button>
          </td>
        </tr>
      `;
    });

    addDeleteHandlers();
  } catch(err) {
    console.error(err);
    alert("Failed to load sessions");
  }
}

// Single delete handler
function addDeleteHandlers(){
  document.querySelectorAll('.deleteBtn[data-id]').forEach(btn => {
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-id');
      if(confirm("Are you sure you want to delete this session?")){
        await fetch('/api/delete-session', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ sessionId: id })
        });
        loadSessions();
      }
    };
  });
}

// Select All functionality
document.getElementById('selectAll').addEventListener('change', (e)=>{
  const checked = e.target.checked;
  document.querySelectorAll('.selectSession').forEach(cb=>cb.checked = checked);
});

// Delete Selected
document.getElementById('deleteSelectedBtn').addEventListener('click', async ()=>{
  const selected = Array.from(document.querySelectorAll('.selectSession'))
                        .filter(cb=>cb.checked)
                        .map(cb=>cb.getAttribute('data-id'));
  if(selected.length === 0) return alert("No sessions selected!");
  if(!confirm(`Are you sure you want to delete ${selected.length} session(s)?`)) return;

  await fetch('/api/delete-session', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ sessionIds: selected })
  });

  loadSessions();
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await fetch('/api/logout', { method:'POST' });
  window.location.href='/';
});

loadSessions();

  // --- Mobile Menu Toggle ---
  const menuIcon = document.getElementById('menu-icon');
  const navLinks = document.getElementById('nav-links');
  menuIcon.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    menuIcon.classList.toggle('active');
  });

</script>

</body>
</html>
