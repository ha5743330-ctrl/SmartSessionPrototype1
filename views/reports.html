<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reports</title>
<style>
/* ---------- BODY ---------- */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-image: url('/images/background-img.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: rgba(0,0,0,0.5);
  background-blend-mode: overlay;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ---------- NAVBAR ---------- */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgb(255, 255, 255);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(10px);
  z-index: 10;
  /* box-shadow: 0 0 15px rgba(0,255,255,0.3); */
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-img {
  height: 40px;
  width: auto;
}

nav ul {
  list-style: none;
  display: flex;
  margin-right: 40px;
  padding: 0;
}
nav ul li {
  margin: 0 15px;
}
nav ul li a {
  color: #101699;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}
nav ul li a:hover {
  color: #00ffcc;
  text-shadow: 0 0 10px #00ffcc;
}

/* Hamburger icon */
.menu-icon {
  display: none;
  flex-direction: column;
  cursor: pointer;
  width: 25px;
  height: 20px;
  justify-content: space-between;
}
.menu-icon div {
  width: 100%;
  height: 3px;
  background-color: #101699;
  border-radius: 2px;
  transition: 0.3s;
}

/* ---------- CONTAINER ---------- */
.container {
  margin-top: 120px;
  background: rgba(255,255,255,0.05);
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
        clip-path: polygon(0 0, 100% 10%, 95% 100%, 5% 95%);

  /* box-shadow: 0 0 20px #00ffcc; */
  width: 85%;
  max-width: 1000px;
}

h1 { text-align: center; color: #00ffcc; margin-bottom: 20px; }

/* ---------- TABLE ---------- */
.table-wrapper {
  width: 100%;
  max-height: 400px;  /* vertical scroll height */
  overflow-y: auto;   /* vertical scroll */
  overflow-x: auto;   /* horizontal scroll */
}

table {
  width: 100%;
  min-width: 850px; /* ensure horizontal scroll for many columns */
  border-collapse: collapse;
  color: white;
}
thead th {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.85);
  z-index: 2;
  padding: 12px;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  text-align: center;
}
tr:hover { background: rgba(0,255,204,0.1); }

/* ---------- BUTTONS ---------- */
button {
  padding: 8px 15px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  margin: 5px;
}
.deleteBtn { background-color: #ff4d4f; color: white; }
.deleteBtn:hover { background-color: #ff7875; }

/* ---------- FOOTER ---------- */
footer {
  width: 100%;
  background: rgba(0,0,0,0.7);
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 14px;
  margin-top: auto; /* magic line */
}

/* ---------- SELECT ALL ---------- */
#selectAllContainer {
  margin-bottom: 10px;
  text-align: left;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px) {
  nav ul {
    position: absolute;
    top: 65px;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.9);
    flex-direction: column;
    align-items: center;
    max-height: 0;
    overflow: hidden;
  }
  nav ul.active { max-height: 500px; padding: 10px 0; }
  nav ul li { margin: 15px 0; }
  .menu-icon { display: flex; margin-right: 40px; }
}
.menu-icon.active div:nth-child(1) { transform: rotate(45deg) translateY(8px); }
.menu-icon.active div:nth-child(2) { opacity: 0; }
.menu-icon.active div:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }

/* Mobile table text smaller */
@media (max-width: 600px) {
  th, td { font-size: 13px; padding: 8px; }
}

/* Scrollbar styling */
.table-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
.table-wrapper::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 10px; }
.table-wrapper::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="/images/logo1.png" alt="SmartSession Logo" class="logo-img">
  </div>
  <div class="menu-icon" id="menu-icon">
    <div></div><div></div><div></div>
  </div>
  <ul id="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/signin">Sign In</a></li>
    <li><a href="/create-session">Start Session</a></li>
    <li><a href="/join-session">Join Session</a></li>
    <li><a href="/view-sessions">View Sessions</a></li>
    <li><a href="/reports">Reports</a></li>
    <li><a href="#" id="logoutBtn">Logout</a></li>
  </ul>
</nav>

<div class="container">
  <h1>Activity Reports</h1>
  <div id="selectAllContainer">
    <input type="checkbox" id="selectAll"> Select All
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>User</th>
          <th>Email</th>
          <th>Action</th>
          <th>Date & Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="reportsTable">
        <tr><td colspan="6">Loading reports...</td></tr>
      </tbody>
    </table>
  </div>

  <button id="deleteSelectedBtn" class="deleteBtn">Delete Selected</button>
</div>

<footer>© 2025 SmartSession Management | All Rights Reserved</footer>

<script>
// Load Reports
async function loadReports() {
  try {
    const res = await fetch('/api/reports');
    if (res.status === 401) { alert("Please login first"); window.location.href='/signin'; return; }

    const reports = await res.json();
    const table = document.getElementById('reportsTable');
    table.innerHTML = '';

    if (reports.length === 0) {
      table.innerHTML = `<tr><td colspan="6">No reports found</td></tr>`;
      return;
    }

    reports.forEach(report => {
      table.innerHTML += `
        <tr>
          <td><input type="checkbox" class="selectReport" data-id="${report._id}"></td>
          <td>${report.user?.name || 'N/A'}</td>
          <td>${report.user?.email || 'N/A'}</td>
          <td>${report.action}</td>
          <td>${new Date(report.createdAt).toLocaleString()}</td>
          <td><button class="deleteBtn" data-id="${report._id}">Delete</button></td>
        </tr>
      `;
    });
    addDeleteHandlers();
  } catch (err) {
    console.error(err);
    alert("Failed to load reports");
  }
}

// Delete handlers
function addDeleteHandlers() {
  document.querySelectorAll('.deleteBtn[data-id]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      if (!confirm("Are you sure you want to delete this report?")) return;
      await fetch('/api/delete-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({reportId:id}) });
      loadReports();
    }
  });
}

// Select All
document.getElementById('selectAll')?.addEventListener('change', e => {
  document.querySelectorAll('.selectReport').forEach(cb => cb.checked = e.target.checked);
});

// Delete Selected
document.getElementById('deleteSelectedBtn')?.addEventListener('click', async () => {
  const selected = Array.from(document.querySelectorAll('.selectReport')).filter(cb=>cb.checked).map(cb=>cb.dataset.id);
  if (selected.length===0) return alert("No reports selected!");
  if (!confirm(`Are you sure you want to delete ${selected.length} report(s)?`)) return;
  await fetch('/api/delete-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({reportIds:selected}) });
  loadReports();
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/api/logout',{method:'POST'}); window.location.href='/'; });

// Initial load
loadReports();

// Mobile menu toggle
const menuIcon = document.getElementById('menu-icon');
const navLinks = document.getElementById('nav-links');
menuIcon.addEventListener('click', () => { navLinks.classList.toggle('active'); menuIcon.classList.toggle('active'); });
</script>

</body>
</html>
