<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Analytics | SmartSession</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --neon-cyan: #00ffcc;
  --bg-dark: #06060c;
  --card-bg: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.08);
}

body {
  margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg-dark) url('/images/background-img.jpg') center/cover no-repeat fixed;
  background-blend-mode: overlay; color: #fff; min-height: 100vh;
}

/* --- Fixed Navbar (Your Original Style) --- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-img { height: 40px; width: auto; }
    nav ul { list-style: none; display: flex; margin: 0px 40px 0px 0px; padding: 0; transition: 0.3s; }
    nav ul li { margin: 0 15px; }
    nav ul li a { color: #101699; text-decoration: none; font-weight: 500; transition: 0.3s; }
    nav ul li a:hover { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 28px;
      height: 20px;
      justify-content: space-between;
    }
    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }
/* --- Dashboard Layout --- */
.main-wrapper {
  margin: 100px auto 50px; width: 92%; max-width: 1300px;
  animation: fadeIn 0.6s ease-out;
}

/* Stats Row */
.stats-container {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px; margin-bottom: 30px;
}
.stat-box {
  background: var(--card-bg); padding: 25px; border-radius: 20px;
  border: 1px solid var(--border); backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
}
.stat-box i { position: absolute; right: 20px; top: 20px; opacity: 0.1; font-size: 40px; color: var(--neon-cyan); }
.stat-box span { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.stat-box h2 { font-size: 32px; margin: 10px 0 0; color: var(--neon-cyan); }

/* Chart Area */
.chart-box {
  background: var(--card-bg); border-radius: 24px; padding: 25px;
  border: 1px solid var(--border); backdrop-filter: blur(20px); margin-bottom: 30px;
}

/* Table Management */
.content-card {
  background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border);
  backdrop-filter: blur(20px); overflow: hidden;
}
.card-header {
  padding: 25px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
}

.search-field {
  position: relative; flex: 1; max-width: 400px;
}
.search-field input {
  width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
  padding: 12px 15px 12px 45px; border-radius: 12px; color: #fff; outline: none;
}
.search-field i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--neon-cyan); }

.table-wrapper { overflow-x: auto; width: 100%; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th { background: rgba(255,255,255,0.02); padding: 18px; text-align: left; font-size: 12px; color: var(--neon-cyan); text-transform: uppercase; }
td { padding: 18px; border-bottom: 1px solid var(--border); font-size: 14px; }
tr:hover { background: rgba(255,255,255,0.01); }

/* Status Badges */
.action-badge {
  padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;
  background: rgba(0, 255, 204, 0.1); color: var(--neon-cyan); border: 1px solid rgba(0, 255, 204, 0.2);
}

.btn-group { display: flex; gap: 10px; }
.btn-action {
  padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer;
  font-weight: 600; font-size: 13px; transition: 0.3s;
}
.btn-export { background: #fff; color: #000; }
.btn-del-multi { background: #ff4d4f; color: #fff; display: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      nav ul {
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
      }
      nav ul.active { max-height: 500px; padding: 10px 0; }
      nav ul li { margin: 15px 0; }
      .menu-icon { display: flex; margin: 0px 40px 0px 0px; }
    }
    .menu-icon.active div:nth-child(1) { transform: rotate(45deg) translateY(8px); }
    .menu-icon.active div:nth-child(2) { opacity: 0; }
    .menu-icon.active div:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }
      nav ul li a:hover, nav ul li a.active { color: var(--white); border-bottom: 2px solid var(--accent-red); }
</style>
</head>

<body>

     <!-- Navbar -->
  <nav>
    <div class="logo">
      <img src="/images/logo1.png" class="logo-img">
    </div>
    <div class="menu-icon" id="menu-icon">
      <div></div><div></div><div></div>
    </div>
    <ul id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signin">Sign In</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/join-session">Join Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="/settings" class="nav-settings">Settings</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

<div class="main-wrapper">
  <div class="stats-container">
    <div class="stat-box">
      <span>Total Logs</span><h2 id="totalLogs">0</h2><i class="fas fa-database"></i>
    </div>
    <div class="stat-box">
      <span>Active Users</span><h2 id="activeUsers">0</h2><i class="fas fa-users"></i>
    </div>
    <div class="stat-box">
      <span>Today's Ops</span><h2 id="todayOps">0</h2><i class="fas fa-bolt"></i>
    </div>
  </div>

  <div class="chart-box">
    <div id="mainChart"></div>
  </div>

  <div class="content-card">
    <div class="card-header">
      <div class="search-field">
        <i class="fas fa-search"></i>
        <input type="text" id="logSearch" placeholder="Search by name, action or date...">
      </div>
      <div class="btn-group">
        <button id="multiDelete" class="btn-action btn-del-multi"><i class="fas fa-trash"></i> Delete Selected</button>
        <button class="btn-action btn-export" onclick="downloadCSV()"><i class="fas fa-file-csv"></i> Export Data</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;"><input type="checkbox" id="masterCheck"></th>
            <th>User Info</th>
            <th>Action Type</th>
            <th>Exact Timestamp</th>
            <th style="text-align: right;">Management</th>
          </tr>
        </thead>
        <tbody id="reportsBody">
          </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let reportsData = [];
let chartInstance = null;

async function initPage() {
  try {
    const res = await fetch('/api/reports');
    if (!res.ok) throw new Error("Unauthorized");
    
    reportsData = await res.json();
    
    updateCounters(reportsData);
    renderTable(reportsData);
    renderChart(reportsData);
  } catch (err) {
    console.error("Fetch error:", err);
    document.getElementById('reportsBody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding:50px;">Failed to sync records. Check login session.</td></tr>';
  }
}

function updateCounters(data) {
  document.getElementById('totalLogs').innerText = data.length;
  const uniqueUsers = [...new Set(data.map(r => r.user?.email))].length;
  document.getElementById('activeUsers').innerText = uniqueUsers;
  
  const today = new Date().toDateString();
  const todayCount = data.filter(r => new Date(r.createdAt).toDateString() === today).length;
  document.getElementById('todayOps').innerText = todayCount;
}

function renderTable(data) {
  const tbody = document.getElementById('reportsBody');
  tbody.innerHTML = '';

  data.forEach(r => {
    // FIX: Validating Timestamp
    const dateObj = new Date(r.createdAt);
    const isValid = !isNaN(dateObj.getTime());
    const dateStr = isValid ? dateObj.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : "Date Error";

    tbody.innerHTML += `
      <tr>
        <td><input type="checkbox" class="rowCheck" data-id="${r._id}" onchange="toggleBulkBtn()"></td>
        <td>
          <div style="font-weight:600">${r.user?.name || 'Unknown'}</div>
          <div style="font-size:11px; opacity:0.5">${r.user?.email || 'N/A'}</div>
        </td>
        <td><span class="action-badge">${r.action.toUpperCase()}</span></td>
        <td style="font-family:monospace; color:#aaa;">${dateStr}</td>
        <td style="text-align: right;">
          <button onclick="deleteSingle('${r._id}')" style="background:none; border:none; color:#ff4d4f; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
        </td>
      </tr>
    `;
  });
}

// FIX: Improved Chart Logic
function renderChart(data) {
  const dailyData = {};
  data.forEach(r => {
    const d = new Date(r.createdAt).toLocaleDateString('en-GB');
    if(d !== "Invalid Date") dailyData[d] = (dailyData[d] || 0) + 1;
  });

  const options = {
    series: [{ name: 'System Activity', data: Object.values(dailyData) }],
    chart: { height: 300, type: 'area', toolbar: { show: false }, foreColor: '#888' },
    colors: ['#00ffcc'],
    dataLabels: { enabled: false },
    stroke: { curve: 'smooth', width: 2 },
    xaxis: { categories: Object.keys(dailyData) },
    grid: { borderColor: 'rgba(255,255,255,0.05)' },
    fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.1 } }
  };

  if(chartInstance) chartInstance.destroy();
  chartInstance = new ApexCharts(document.querySelector("#mainChart"), options);
  chartInstance.render();
}

// --- Interaction Logic ---
document.getElementById('logSearch').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  const filtered = reportsData.filter(r => 
    (r.user?.name || "").toLowerCase().includes(term) || 
    r.action.toLowerCase().includes(term)
  );
  renderTable(filtered);
});

function toggleBulkBtn() {
  const checked = document.querySelectorAll('.rowCheck:checked').length;
  document.getElementById('multiDelete').style.display = checked > 0 ? 'block' : 'none';
}

document.getElementById('masterCheck').onclick = (e) => {
  document.querySelectorAll('.rowCheck').forEach(cb => cb.checked = e.target.checked);
  toggleBulkBtn();
};

async function deleteSingle(id) {
  if(!confirm("Erase this entry?")) return;
  await fetch('/api/delete-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({reportId:id}) });
  initPage();
}

document.getElementById('multiDelete').onclick = async () => {
  const ids = Array.from(document.querySelectorAll('.rowCheck:checked')).map(cb => cb.dataset.id);
  if(confirm(`Delete ${ids.length} entries?`)) {
    await fetch('/api/delete-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({reportIds:ids}) });
    initPage();
  }
};

function downloadCSV() {
  let csv = "User,Email,Action,Timestamp\n";
  reportsData.forEach(r => csv += `${r.user?.name},${r.user?.email},${r.action},${r.createdAt}\n`);
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'SmartSession_Reports.csv'; a.click();
}

// Start
initPage();
// --- 8. Logout & Navbar ---
document.getElementById("logoutBtn").onclick = async () => {
    // Confirmation Dialog
    const confirmLogout = confirm("Are you sure you want to log out? Any unsaved progress might be lost.");

    if (confirmLogout) {
        try {
            const response = await fetch("/api/logout", { method: "POST" });
            
            if (response.ok) {
                // Logout successful
                window.location.href = "/";
            } else {
                alert("Logout failed. Please try again.");
            }
        } catch (error) {
            console.error("Logout Error:", error);
            alert("Connection error. Could not log out.");
        }
    } else {
        // Agar user 'Cancel' click kare
        console.log("Logout cancelled by user.");
    }
};

    const menuIcon = document.getElementById('menu-icon');
    const navLinks = document.getElementById('nav-links');
    menuIcon.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        menuIcon.classList.toggle('active');
    });
</script>

</body>
</html>
