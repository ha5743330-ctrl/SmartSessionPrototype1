  <script>
    // Ngrok-style interactive background
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    
    // Grid position ko halka sa shift karna
    document.body.style.backgroundPosition = `${x * 0.05}px ${y * 0.05}px`;
});
// State section mein add karein
    // ===== FULL POLISHED REMOTE VIEWER SCRIPT =====

// Socket Init with auto-reconnect
const socket = io({
  reconnection: true,
  reconnectionAttempts: 5,
  reconnectionDelay: 1000
});

// UI Elements
const joinBtn = document.getElementById("joinBtn");
const codeInput = document.getElementById("sessionCode");
const connecting = document.getElementById("connectingText");
const remoteVideo = document.getElementById("remoteVideo");

// State
let currentRoom = null;
let isRemoteEnabled = false;
let laserEnabled = false;

// ===== HELPER =====
function sendControlEvent(type, data) {
  if (!currentRoom) return;
  socket.emit("viewer-control", {
    roomId: currentRoom,
    type,
    data
  });
}

// ===== JOIN SESSION =====
joinBtn.addEventListener("click", async () => {
  const sessionCode = codeInput.value.trim();
  if (!sessionCode) return showToast("Enter session code");

  connecting.style.display = "block";
  connecting.innerHTML = "⏳ Connecting...";

  try {
    const res = await fetch("/api/join-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionCode })
    });

    const data = await res.json();

    if (!data.success) {
      connecting.innerHTML = "❌ " + data.message;
      return;
    }

    currentRoom = sessionCode;
    connecting.innerHTML = "✅ Connected";

    if (window.joinRoomAsViewer) {
      window.joinRoomAsViewer(sessionCode, remoteVideo);
    }
  } catch (err) {
    showToast("Connection failed");
  }
});

// ===== PROFESSIONAL MOUSE CONTROL SYSTEM =====

const overlay = document.getElementById("control-overlay");

let lastSend = 0;
let isDragging = false;
let pressedButton = null;
let mouseTimer = null;

// ===== 1. MOUSE MOVE (SMART + DRAG SUPPORT) =====
overlay.addEventListener("mousemove", (e) => {
    if (!currentRoom || (!isRemoteEnabled && !laserEnabled)) return;

    const rect = overlay.getBoundingClientRect();
    const x = e.offsetX / rect.width;
    const y = e.offsetY / rect.height;

    const now = Date.now();

    // Smooth 60 FPS throttling
    if (now - lastSend > 16) {
        sendControlEvent(
            isRemoteEnabled
                ? (isDragging ? "mouse-drag" : "mouse-move")
                : "pointer-move",
            { x, y }
        );

        lastSend = now;
    }
});


// ===== 2. MOUSE DOWN (DRAG START) =====
overlay.addEventListener("mousedown", (e) => {
    if (!isRemoteEnabled) return;

    const rect = overlay.getBoundingClientRect();
    const x = e.offsetX / rect.width;
    const y = e.offsetY / rect.height;

    pressedButton = (e.button === 2) ? "right" : "left";
    isDragging = true;

    // Safety auto release
    if (mouseTimer) clearTimeout(mouseTimer);
    mouseTimer = setTimeout(() => {
        sendControlEvent("mouse-up", { button: pressedButton });
        isDragging = false;
        pressedButton = null;
    }, 8000);

    sendControlEvent("mouse-down", { x, y, button: pressedButton });
});


// ===== 3. MOUSE UP (DRAG END) =====
overlay.addEventListener("mouseup", (e) => {
    if (!isRemoteEnabled) return;

    const rect = overlay.getBoundingClientRect();
    const x = e.offsetX / rect.width;
    const y = e.offsetY / rect.height;

    if (mouseTimer) clearTimeout(mouseTimer);

    const buttonType = (e.button === 2) ? "right" : "left";

    sendControlEvent("mouse-up", { x, y, button: buttonType });

    isDragging = false;
    pressedButton = null;
});


// ===== 4. DOUBLE CLICK =====
overlay.addEventListener("dblclick", (e) => {
    if (!isRemoteEnabled) return;

    const rect = overlay.getBoundingClientRect();

    sendControlEvent("mouse-click", {
        x: e.offsetX / rect.width,
        y: e.offsetY / rect.height,
        action: "double-click"
    });
});


// ===== 5. MOUSE LEAVE (SAFE RELEASE) =====
overlay.addEventListener("mouseleave", () => {
    if (!isRemoteEnabled) return;

    if (mouseTimer) clearTimeout(mouseTimer);

    if (pressedButton) {
        sendControlEvent("mouse-up", { button: pressedButton });
        pressedButton = null;
    }

    isDragging = false;
});


// ===== 6. SCROLL =====
overlay.addEventListener("wheel", (e) => {
    if (!isRemoteEnabled) return;

    e.preventDefault();

    sendControlEvent("mouse-scroll", {
        delta: e.deltaY
    });

}, { passive: false });


// ===== 7. DISABLE RIGHT CLICK MENU =====
overlay.addEventListener("contextmenu", (e) => e.preventDefault());
function updateStatus() {
    // Ye line add karein
    overlay.style.cursor = isRemoteEnabled ? 'none' : 'crosshair';

    showToast(
        isRemoteEnabled ? "🖱️ Remote Control Enabled" : 
        laserEnabled ? "🔴 Laser Pointer Enabled" : "Controls Off"
    );
}
// ===== TOGGLES =====
document.getElementById("laserBtn").onclick = () => {
  laserEnabled = !laserEnabled;
  isRemoteEnabled = false;
  updateStatus();
};

document.getElementById("remoteControlBtn").onclick = function () {
  isRemoteEnabled = !isRemoteEnabled;
  laserEnabled = false;
  updateStatus();
};

function updateStatus() {
  showToast(
    isRemoteEnabled
      ? "🖱️ Remote Control Enabled"
      : laserEnabled
      ? "🔴 Laser Pointer Enabled"
      : "Controls Off"
  );
}

// ===== FILE SHARING (CHUNK SAFE) =====
document.getElementById("fileShareBtn").onclick = () => {
  const input = document.createElement("input");
  input.type = "file";

  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file || !currentRoom) return;

    const chunkSize = 64 * 1024;
    let offset = 0;

    const reader = new FileReader();

    reader.onload = (event) => {
      sendControlEvent("file-chunk", {
        fileName: file.name,
        chunk: event.target.result,
        offset,
        done: offset >= file.size
      });

      offset += chunkSize;
      if (offset < file.size) {
        readSlice(offset);
      } else {
        showToast("✅ File Sent");
      }
    };

    const readSlice = (o) => {
      const slice = file.slice(o, o + chunkSize);
      reader.readAsArrayBuffer(slice);
    };

    readSlice(0);
  };

  input.click();
};

// ===== FULLSCREEN =====
function toggleFullScreen() {
  const player = document.getElementById("player");

  if (!document.fullscreenElement) {
    player.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// ===== TEXT COMMAND =====
document.getElementById("sendTextBtn").onclick = () => {
  const text = prompt("Enter message:");
  if (text) sendControlEvent("text-data", { text });
};

// ===== LOGOUT =====
document.getElementById("logoutBtn").onclick = async () => {
  if (!confirm("Logout?")) return;

  try {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/";
  } catch {
    showToast("Logout failed");
  }
};

   // Master Toggle for Glass Mode
const mainGlassToggle = document.getElementById('mainGlassToggle');

mainGlassToggle.addEventListener('change', function() {
    if (this.checked) {
        document.body.classList.add('glass-enabled');
    } else {
        document.body.classList.remove('glass-enabled');
    }
});

// Aapka existing Menu Icon aur Logout code yahan niche rahega...
const menuIcon = document.getElementById('menu-icon');
const navLinks = document.getElementById('nav-links');
menuIcon.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    menuIcon.classList.toggle('active');
});

// ===== TOAST SYSTEM (REPLACES ALERT) =====
function showToast(msg) {
  const toast = document.createElement("div");
  toast.innerText = msg;
  toast.style = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    color: #fff;
    padding: 10px 15px;
    border-radius: 8px;
    z-index: 9999;
  `;
  document.body.appendChild(toast);

  setTimeout(() => toast.remove(), 2500);
}

// ===== SESSION END =====
socket.on("sessionEnded", () => {
  showToast("Session Ended");
  setTimeout(() => (window.location.href = "/"), 1500);
});

// ===== WEBRTC STREAM =====
if (window.peerConnection) {
  peerConnection.ontrack = (event) => {
    if (remoteVideo.srcObject !== event.streams[0]) {
      remoteVideo.srcObject = event.streams[0];
    }
  };
}



window.addEventListener('keydown', (e) => {
    if (!currentRoom) return;
    
    socket.emit("viewer-control", {
        roomId: currentRoom,
        type: "key-direct",
        data: {
            key: e.key,
            ctrl: e.ctrlKey,
            alt: e.altKey,
            shift: e.shiftKey
        }
    });
});

</script>
</body>
</html>
