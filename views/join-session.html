<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Smart Session</title>
  <link rel="stylesheet" href="/style.css">

  <style>
      body {
        margin: 0;
        font-family: Poppins, sans-serif;
        background: url('/images/report-background.jpg') center/cover no-repeat fixed;
        background-color: rgba(0,0,0,0.45);
        background-blend-mode: overlay;

        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-img { height: 40px; width: auto; }
    nav ul { list-style: none; display: flex; margin: 0px 40px 0px 0px; padding: 0; transition: 0.3s; }
    nav ul li { margin: 0 15px; }
    nav ul li a { color: #101699; text-decoration: none; font-weight: 500; transition: 0.3s; }
    nav ul li a:hover { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 28px;
      height: 20px;
      justify-content: space-between;
    }
    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }

/* Modern Glassmorphism Theme */
body {
    background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    margin: 0;
}

.container {
    background: rgba(255, 255, 255, 0.03);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 95%;
    max-width: 700px;
    text-align: center;
    margin: 80px auto;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.header-section h1 {
    margin: 0;
    font-size: 2rem;
    background: linear-gradient(to right, #00ffaa, #00e5ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-weight: 800;
}

.subtitle {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 25px;
}

/* Input Improvements */
.input-wrapper {
    background: rgba(0, 0, 0, 0.2);
    padding: 10px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

#sessionCode {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid rgba(0, 255, 170, 0.3);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 18px;
    text-align: center;
    transition: all 0.3s ease;
}

#sessionCode:focus {
    outline: none;
    border-color: #00ffaa;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
}



#joinBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0, 255, 170, 0.3);
    filter: brightness(1.1);
}

/* Video Styling */
.video-container {
    margin-top: 25px;
    position: relative;
    border-radius: 15px;
    overflow: hidden;
    border: 2px solid rgba(0, 255, 170, 0.2);
    background: #000;
}

video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
}

/* Control Center */
.control-center {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 15px;
    margin-top: 25px;
}

.control-center h3 {
    font-size: 1rem;
    margin-bottom: 15px;
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.button-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.btn-group {
    padding: 12px 5px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.btn-group:hover {
    transform: scale(1.05);
    filter: saturate(1.5) brightness(1.2);
}

.blue { background: #0984e3; color: #fff; }
.green { background: #00b894; color: #fff; }
.orange { background: #e17055; color: #fff; }

/* Connecting Animation */
#connectingText {
    display: none;
    color: #00ffaa;
    margin: 15px 0;
    font-size: 14px;
}

.pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ffaa;
    border-radius: 50%;
    margin-right: 8px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
}

@media (max-width: 550px) {
    .button-group { grid-template-columns: 1fr 1fr; }
    .container { padding: 20px; margin-top: 40px; }
}

    footer {
  margin-top: auto;
  width: 100%;
  background: rgba(0,0,0,0.6);
  padding: 15px;
  text-align: center;
  color: white;
  font-size: 14px;
}


    .control-buttons {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .control-buttons button {
      width: auto;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      color: #000;
    }
    .btn.anydesk-btn {
  position: relative;
  padding: 14px 40px;
  font-size: 16px;
  border-radius: 8px;
  text-decoration: none;
  color: #ffffff;
  background: #e21e14; /* AnyDesk signature red */
  border: none;
  display: inline-block;
  cursor: pointer;
  overflow: hidden;
  transition: background 0.2s ease;
}

.btn.anydesk-btn:hover {
  background: #aa0900; /* thoda darker on hover */
}

.btn.anydesk-btn::before {
  content: "";
  position: absolute;
  top: var(--y);
  left: var(--x);
  width: 180px;
  height: 180px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgb(86, 207, 6), transparent 60%);
  opacity: 0;
  border-radius: 50%;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}

.btn.anydesk-btn:hover::before {
  opacity: 0.6;
}


    @media (max-width: 900px) {
      nav ul {
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
      }
      nav ul.active { max-height: 500px; padding: 10px 0; }
      nav ul li { margin: 15px 0; }
      .menu-icon { display: flex; margin: 0px 40px 0px 0px; }
    }
    .menu-icon.active div:nth-child(1) { transform: rotate(45deg) translateY(8px); }
    .menu-icon.active div:nth-child(2) { opacity: 0; }
    .menu-icon.active div:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }
      nav ul li a:hover, nav ul li a.active { color: var(--white); border-bottom: 2px solid var(--accent-red); }
      /* Fullscreen mode mein container ko poori screen pe phailane ke liye */
#player:fullscreen {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000; /* Background black rakhein */
}

/* Safari support */
#player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    background-color: #000;
}

/* Fullscreen mein controls ko hamesha upar rakhne ke liye */
#player:fullscreen .stream-controls {
    bottom: 20px;
    z-index: 9999;
}

        #tsparticles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* BACKGROUND */
    pointer-events: none; /* content clickable rahe */
}
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">
      <img src="/images/logo1.png" class="logo-img">
    </div>
    <div class="menu-icon" id="menu-icon">
      <div></div><div></div><div></div>
    </div>
    <ul id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signin">Sign In</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/join-session">Join Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="/settings" class="nav-settings">Settings</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <!-- Join Container -->
<div class="container">
    <div class="header-section">
        <h1>Join Smart Session</h1>
        <p class="subtitle">Enter your code to access the remote environment</p>
    </div>

    <div class="input-wrapper">
        <input type="text" id="sessionCode" placeholder="Enter Session Code">
        <button id="joinBtn" class="btn anydesk-btn">Connect Now</button>
    </div>

    <div id="connectingText">
        <span class="pulse"></span> 🔗 Connecting to host...
    </div>

<div class="video-container" id="player" style="position: relative;">
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="control-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; cursor: crosshair;"></div>
</div>

    <div class="control-center">
        <h3><i class="fas fa-terminal"></i> Session Controls</h3>
        <div class="button-group">
            <button id="fileShareBtn" class="btn-group blue">📁 File Share</button>
            <button id="remoteControlBtn" class="btn-group green">🖱️ Remote Access</button>
            <button id="basicControlBtn" class="btn-group orange">⚙️ Basic Controls</button>
            <button id="laserBtn" class="btn-group orange">🔴 Laser Pointer</button>
            <button id="sendTextBtn" class="btn-group orange">⌨️ Send Text</button>
            <button id="screenshotBtn" class="btn-group orange">📸 Screenshot</button>
            <button onclick="toggleFullScreen()" class="btn-group blue">
            <i class="fas fa-expand"></i> Fullscreen </button>
        </div>
    </div>
</div>
</div>
  <footer>© 2025 SmartSession | All Rights Reserved</footer>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/signaling.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>


  <script>
// State section mein add karein
let lastSend = 0;                                     
    // ===== FULL POLISHED REMOTE VIEWER SCRIPT =====

// Socket Init with auto-reconnect
const socket = io({
  reconnection: true,
  reconnectionAttempts: 5,
  reconnectionDelay: 1000
});

// UI Elements
const joinBtn = document.getElementById("joinBtn");
const codeInput = document.getElementById("sessionCode");
const connecting = document.getElementById("connectingText");
const remoteVideo = document.getElementById("remoteVideo");

// State
let currentRoom = null;
let isRemoteEnabled = false;
let laserEnabled = false;

// ===== HELPER =====
function sendControlEvent(type, data) {
  if (!currentRoom) return;
  socket.emit("viewer-control", {
    roomId: currentRoom,
    type,
    data
  });
}

// ===== JOIN SESSION =====
joinBtn.addEventListener("click", async () => {
  const sessionCode = codeInput.value.trim();
  if (!sessionCode) return showToast("Enter session code");

  connecting.style.display = "block";
  connecting.innerHTML = "⏳ Connecting...";

  try {
    const res = await fetch("/api/join-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionCode })
    });

    const data = await res.json();

    if (!data.success) {
      connecting.innerHTML = "❌ " + data.message;
      return;
    }

    currentRoom = sessionCode;
    connecting.innerHTML = "✅ Connected";

    if (window.joinRoomAsViewer) {
      window.joinRoomAsViewer(sessionCode, remoteVideo);
    }
  } catch (err) {
    showToast("Connection failed");
  }
});

// ===== MOUSE CONTROL =====
const overlay = document.getElementById("control-overlay");

overlay.addEventListener("mousemove", (e) => {
    if (!currentRoom || (!isRemoteEnabled && !laserEnabled)) return;

    // e.clientX ki jagah rect aur offset use karein for 100% precision
    const rect = overlay.getBoundingClientRect();
    const x = e.offsetX / rect.width;
    const y = e.offsetY / rect.height;

    // Throttling: Har move event mat bhejein (Lag fix)
    const now = Date.now();
    if (now - lastSend > 15) { 
        sendControlEvent(isRemoteEnabled ? "mouse-move" : "pointer-move", { x, y });
        lastSend = now;
    }
});
overlay.addEventListener("contextmenu", (e) => e.preventDefault()); // Right click menu block

overlay.addEventListener("mousedown", (e) => {
    if (!isRemoteEnabled) return;
    
    const rect = overlay.getBoundingClientRect();
    const x = e.offsetX / rect.width;
    const y = e.offsetY / rect.height;

    let action = "left-click";
    if (e.button === 2) action = "right-click";
    
    sendControlEvent("mouse-click", { x, y, action });
});
overlay.addEventListener("dblclick", (e) => {
    if (!isRemoteEnabled) return;
    const rect = overlay.getBoundingClientRect();
    sendControlEvent("mouse-click", { 
        x: e.offsetX / rect.width, 
        y: e.offsetY / rect.height, 
        action: "double-click" 
    });
});
function updateStatus() {
    // Ye line add karein
    overlay.style.cursor = isRemoteEnabled ? 'none' : 'crosshair';

    showToast(
        isRemoteEnabled ? "🖱️ Remote Control Enabled" : 
        laserEnabled ? "🔴 Laser Pointer Enabled" : "Controls Off"
    );
}
// ===== TOGGLES =====
document.getElementById("laserBtn").onclick = () => {
  laserEnabled = !laserEnabled;
  isRemoteEnabled = false;
  updateStatus();
};

document.getElementById("remoteControlBtn").onclick = function () {
  isRemoteEnabled = !isRemoteEnabled;
  laserEnabled = false;
  updateStatus();
};

function updateStatus() {
  showToast(
    isRemoteEnabled
      ? "🖱️ Remote Control Enabled"
      : laserEnabled
      ? "🔴 Laser Pointer Enabled"
      : "Controls Off"
  );
}

// ===== FILE SHARING (CHUNK SAFE) =====
document.getElementById("fileShareBtn").onclick = () => {
  const input = document.createElement("input");
  input.type = "file";

  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file || !currentRoom) return;

    const chunkSize = 64 * 1024;
    let offset = 0;

    const reader = new FileReader();

    reader.onload = (event) => {
      sendControlEvent("file-chunk", {
        fileName: file.name,
        chunk: event.target.result,
        offset,
        done: offset >= file.size
      });

      offset += chunkSize;
      if (offset < file.size) {
        readSlice(offset);
      } else {
        showToast("✅ File Sent");
      }
    };

    const readSlice = (o) => {
      const slice = file.slice(o, o + chunkSize);
      reader.readAsArrayBuffer(slice);
    };

    readSlice(0);
  };

  input.click();
};

// ===== FULLSCREEN =====
function toggleFullScreen() {
  const player = document.getElementById("player");

  if (!document.fullscreenElement) {
    player.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// ===== TEXT COMMAND =====
document.getElementById("sendTextBtn").onclick = () => {
  const text = prompt("Enter message:");
  if (text) sendControlEvent("text-data", { text });
};

// ===== LOGOUT =====
document.getElementById("logoutBtn").onclick = async () => {
  if (!confirm("Logout?")) return;

  try {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/";
  } catch {
    showToast("Logout failed");
  }
};

// ===== NAVBAR =====
const menuIcon = document.getElementById("menu-icon");
const navLinks = document.getElementById("nav-links");

menuIcon.addEventListener("click", () => {
  navLinks.classList.toggle("active");
  menuIcon.classList.toggle("active");
});

// ===== TOAST SYSTEM (REPLACES ALERT) =====
function showToast(msg) {
  const toast = document.createElement("div");
  toast.innerText = msg;
  toast.style = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    color: #fff;
    padding: 10px 15px;
    border-radius: 8px;
    z-index: 9999;
  `;
  document.body.appendChild(toast);

  setTimeout(() => toast.remove(), 2500);
}

// ===== SESSION END =====
socket.on("sessionEnded", () => {
  showToast("Session Ended");
  setTimeout(() => (window.location.href = "/"), 1500);
});

// ===== WEBRTC STREAM =====
if (window.peerConnection) {
  peerConnection.ontrack = (event) => {
    if (remoteVideo.srcObject !== event.streams[0]) {
      remoteVideo.srcObject = event.streams[0];
    }
  };
}

// // ===== CONNECTION STATUS =====
// socket.on("connect", () => showToast("🟢 Connected"));
// socket.on("disconnect", () => showToast("🔴 Disconnected"));
window.addEventListener('wheel', (e) => {
    // roomId yahan variable hona chahiye jo aapke session ka hai
    socket.emit("viewer-control", { 
        roomId: currentRoomId, 
        type: "mouse-scroll", 
        data: { delta: e.deltaY * -1 } // Invert to match OS behavior
    });
}, { passive: false });
window.addEventListener('contextmenu', (e) => {
    e.preventDefault(); // Browser ka apna menu rokne ke liye
    socket.emit("viewer-control", { 
        roomId: currentRoomId, 
        type: "mouse-click", 
        data: { button: 'right' } 
    });
});
window.addEventListener('keydown', (e) => {
    // Avoid system keys like F12
    if (e.key === 'F12') return;

    socket.emit("viewer-control", { 
        roomId: currentRoomId, 
        type: "key-press", 
        data: { key: e.key } 
    });
});
  </script>
</body>
</html>
