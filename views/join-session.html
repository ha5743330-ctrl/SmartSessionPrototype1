<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Smart Session</title>
  <link rel="stylesheet" href="/style.css">

  <style>
      body {
        margin: 0;
        font-family: Poppins, sans-serif;
        background: url('/images/report-background.jpg') center/cover no-repeat fixed;
        background-color: rgba(0,0,0,0.45);
        background-blend-mode: overlay;

        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-img { height: 40px; width: auto; }
    nav ul { list-style: none; display: flex; margin: 0px 40px 0px 0px; padding: 0; transition: 0.3s; }
    nav ul li { margin: 0 15px; }
    nav ul li a { color: #101699; text-decoration: none; font-weight: 500; transition: 0.3s; }
    nav ul li a:hover { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 28px;
      height: 20px;
      justify-content: space-between;
    }
    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }

/* Modern Glassmorphism Theme */
body {
    background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    margin: 0;
}

.container {
    background: rgba(255, 255, 255, 0.03);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 95%;
    max-width: 700px;
    text-align: center;
    margin: 80px auto;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.header-section h1 {
    margin: 0;
    font-size: 2rem;
    background: linear-gradient(to right, #00ffaa, #00e5ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-weight: 800;
}

.subtitle {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 25px;
}

/* Input Improvements */
.input-wrapper {
    background: rgba(0, 0, 0, 0.2);
    padding: 10px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

#sessionCode {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid rgba(0, 255, 170, 0.3);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 18px;
    text-align: center;
    transition: all 0.3s ease;
}

#sessionCode:focus {
    outline: none;
    border-color: #00ffaa;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
}

#joinBtn {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #00ffaa, #00b894);
    color: #000;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.4s;
}

#joinBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0, 255, 170, 0.3);
    filter: brightness(1.1);
}

/* Video Styling */
.video-container {
    margin-top: 25px;
    position: relative;
    border-radius: 15px;
    overflow: hidden;
    border: 2px solid rgba(0, 255, 170, 0.2);
    background: #000;
}

video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
}

/* Control Center */
.control-center {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 15px;
    margin-top: 25px;
}

.control-center h3 {
    font-size: 1rem;
    margin-bottom: 15px;
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.button-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.btn-group {
    padding: 12px 5px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.btn-group:hover {
    transform: scale(1.05);
    filter: saturate(1.5) brightness(1.2);
}

.blue { background: #0984e3; color: #fff; }
.green { background: #00b894; color: #fff; }
.orange { background: #e17055; color: #fff; }

/* Connecting Animation */
#connectingText {
    display: none;
    color: #00ffaa;
    margin: 15px 0;
    font-size: 14px;
}

.pulse {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ffaa;
    border-radius: 50%;
    margin-right: 8px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
}

@media (max-width: 550px) {
    .button-group { grid-template-columns: 1fr 1fr; }
    .container { padding: 20px; margin-top: 40px; }
}

    footer {
  margin-top: auto;
  width: 100%;
  background: rgba(0,0,0,0.6);
  padding: 15px;
  text-align: center;
  color: white;
  font-size: 14px;
}


    .control-buttons {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .control-buttons button {
      width: auto;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      color: #000;
    }
    .btn-danger {
      background-color: #ff4d4f;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-danger:hover {
      background-color: #ff7875;
    }

    @media (max-width: 900px) {
      nav ul {
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
      }
      nav ul.active { max-height: 500px; padding: 10px 0; }
      nav ul li { margin: 15px 0; }
      .menu-icon { display: flex; margin: 0px 40px 0px 0px; }
    }
    .menu-icon.active div:nth-child(1) { transform: rotate(45deg) translateY(8px); }
    .menu-icon.active div:nth-child(2) { opacity: 0; }
    .menu-icon.active div:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }
      nav ul li a:hover, nav ul li a.active { color: var(--white); border-bottom: 2px solid var(--accent-red); }
      /* Fullscreen mode mein container ko poori screen pe phailane ke liye */
#player:fullscreen {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000; /* Background black rakhein */
}

/* Safari support */
#player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    background-color: #000;
}

/* Fullscreen mein controls ko hamesha upar rakhne ke liye */
#player:fullscreen .stream-controls {
    bottom: 20px;
    z-index: 9999;
}


  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">
      <img src="/images/logo1.png" class="logo-img">
    </div>
    <div class="menu-icon" id="menu-icon">
      <div></div><div></div><div></div>
    </div>
    <ul id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signin">Sign In</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/join-session">Join Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="/settings" class="nav-settings">Settings</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <!-- Join Container -->
<div class="container">
    <div class="header-section">
        <h1>Join Smart Session</h1>
        <p class="subtitle">Enter your code to access the remote environment</p>
    </div>

    <div class="input-wrapper">
        <input type="text" id="sessionCode" placeholder="Enter Session Code">
        <button id="joinBtn">Connect Now</button>
    </div>

    <div id="connectingText">
        <span class="pulse"></span> 🔗 Connecting to host...
    </div>

    <div class="video-container" id="player">
        <video id="remoteVideo" autoplay playsinline poster="https://via.placeholder.com/640x360/000000/00ffaa?text=Waiting+for+Stream..."></video>
    </div>

    <div class="control-center">
        <h3><i class="fas fa-terminal"></i> Session Controls</h3>
        <div class="button-group">
            <button id="fileShareBtn" class="btn-group blue">📁 File Share</button>
            <button id="remoteControlBtn" class="btn-group green">🖱️ Remote Access</button>
            <button id="basicControlBtn" class="btn-group orange">⚙️ Basic Controls</button>
            <button id="laserBtn" class="btn-group orange">🔴 Laser Pointer</button>
            <button id="sendTextBtn" class="btn-group orange">⌨️ Send Text</button>
            <button id="screenshotBtn" class="btn-group orange">📸 Screenshot</button>
            <button onclick="toggleFullScreen()" class="btn-group blue">
            <i class="fas fa-expand"></i> Fullscreen </button>
        </div>
    </div>
</div>
</div>
  <footer>© 2025 SmartSession | All Rights Reserved</footer>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/signaling.js"></script>

  <script>
    const socket = io();
    
    // UI Elements
    const joinBtn = document.getElementById("joinBtn");
    const codeInput = document.getElementById("sessionCode");
    const connecting = document.getElementById("connectingText");
    const remoteVideo = document.getElementById("remoteVideo");
    
    // States
    let isRemoteEnabled = false;
    let laserEnabled = false;

    // --- Helper Function ---
    function sendControlEvent(type, data) {
        if (!window.currentRoom) return;
        socket.emit("viewer-control", { 
            roomId: window.currentRoom, 
            type: type, 
            data: data 
        });
    }

    // --- 1. Join Session Logic ---
    joinBtn.addEventListener("click", async () => {
        const sessionCode = codeInput.value.trim();
        if (!sessionCode) return alert("Enter a session code.");

        connecting.style.display = "block";
        connecting.innerHTML = '<span class="pulse"></span> Connecting to host...';

        const res = await fetch("/api/join-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionCode })
        });

        const data = await res.json();

        if (!data.success) {
            connecting.textContent = "❌ " + data.message;
            return;
        }

        connecting.textContent = "🔗 Connected to Host!";
        window.currentRoom = sessionCode; 
        
        // Signaling.js connection trigger
        if(window.joinRoomAsViewer) {
            window.joinRoomAsViewer(sessionCode, remoteVideo);
        }
    });

    // --- 2. Mouse & Pointer Logic ---
    remoteVideo.addEventListener("mousemove", (e) => {
        if (!window.currentRoom || (!isRemoteEnabled && !laserEnabled)) return;
        
        const rect = remoteVideo.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        if (isRemoteEnabled) {
            sendControlEvent("mouse-move", { x, y });
        } else if (laserEnabled) {
            sendControlEvent("pointer-move", { x, y });
        }
    });

    // Click Logic
    remoteVideo.addEventListener("mousedown", (e) => {
        if (!isRemoteEnabled) return;
        sendControlEvent("mouse-click", { button: e.button });
    });

    // --- 3. Toggles ---
    document.getElementById("laserBtn").onclick = () => {
        laserEnabled = !laserEnabled;
        isRemoteEnabled = false;
        alert(laserEnabled ? "🔴 Laser Pointer Active" : "Laser Off");
    };

    document.getElementById("remoteControlBtn").onclick = function() {
        isRemoteEnabled = !isRemoteEnabled;
        laserEnabled = false;
        this.style.background = isRemoteEnabled ? "#ff4d4f" : "#00b894";
        this.innerHTML = isRemoteEnabled ? "🔒 Stop Access" : "🖱️ Remote Access";
    };

    // --- 4. File Sharing ---
    document.getElementById("fileShareBtn").onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file || !window.currentRoom) return;

            const reader = new FileReader();
            reader.onload = () => {
                sendControlEvent("file-transfer", {
                    fileName: file.name,
                    fileType: file.type,
                    blob: reader.result 
                });
                alert("File Sent!");
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    };

    // --- 5. Fullscreen Logic ---
    function toggleFullScreen() {
        const player = document.getElementById('player');
        if (!document.fullscreenElement) {
            player.requestFullscreen().catch(err => alert("Error enabling fullscreen"));
        } else {
            document.exitFullscreen();
        }
    }

    // --- 6. Host Session Ended Listener ---
    socket.on("sessionEnded", () => {
        alert("The host has closed the session.");
        window.location.href = "/";
    });

    // --- 7. Send Text Command ---
    document.getElementById("sendTextBtn").onclick = () => {
        const text = prompt("Enter text to send to host:");
        if (text) sendControlEvent("text-data", { text });
    };

    // --- 8. Logout & Navbar ---
    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/";
    };

    const menuIcon = document.getElementById('menu-icon');
    const navLinks = document.getElementById('nav-links');
    menuIcon.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        menuIcon.classList.toggle('active');
    });
  </script>
</body>
</html>
