<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face ID Registration | SmartSession</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
:root {
    /* Ngrok inspired dark theme palette */
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.5);
    --success: #10b981;
    --error: #ef4444;
    --bg: #000000; /* Ngrok jaisa pitch black */
    --card-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08); /* Subtle border */
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    position: relative;
}

/* Ngrok Style Grid Background */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 40px linear grid pattern */
    background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black, transparent 80%);
    pointer-events: none;
    z-index: -1;
}

/* Radiant glow at the top for depth */
body::after {
    content: "";
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
}

/* Card glass effect ko ngrok vibes ke liye thoda clean kiya hai */
.auth-container, .card {
    background: #0a0a0a; /* Deep dark grey/black */
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    z-index: 1; /* Center mein content upar dikhe */
}

        /* --- Main Container --- */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            font-size: 28px;
        }

        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }

        /* --- AI Scanning Circle --- */
        .video-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Scanning Border */
        .video-wrapper::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 4px; /* Border thickness */
            background: conic-gradient(from 0deg, transparent, var(--primary), transparent 60%);
            animation: rotate 2s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        #video-container {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 30px var(--primary-glow);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* --- Status & Messages --- */
        .status-box {
            margin: 20px 0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #cbd5e1;
        }

        .status-box.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            animation: shake 0.4s ease-in-out;
        }

        .status-box.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* --- Premium Button --- */
        .btn-register {
            background: var(--primary);
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.5);
        }

        .btn-register:active:not(:disabled) { transform: scale(0.98); }

        .btn-register:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Background Decor */
        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.15;
            z-index: 0;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="orb" style="top: -100px; right: -100px;"></div>
<div class="orb" style="bottom: -100px; left: -100px;"></div>

<div class="container">
    <h2>Face Registration</h2>
    <p>Look directly at the camera to scan.</p>
    
    <div class="video-wrapper">
        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
        </div>
    </div>

    <div id="status" class="status-box">Initialising AI Engine...</div>
    <button id="register-btn" class="btn-register" disabled>Initializing...</button>
</div>

<script>
    // Ngrok-style interactive background
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    
    // Grid position ko halka sa shift karna
    document.body.style.backgroundPosition = `${x * 0.05}px ${y * 0.05}px`;
});
    function getBrightness() {
    if (!video.videoWidth || !video.videoHeight) return 255;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    let sum = 0;
    let count = 0;

    for (let i = 0; i < data.length; i += 4) {
        sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
        count++;
    }

    return sum / count;
}
    // Javascript Logic Same Rahega Jo Aapne Diya Hai
    const video = document.getElementById('video');
    const btn = document.getElementById('register-btn');
    const status = document.getElementById('status');
    const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.6 });

    async function setupRegistration() {
        try {
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/models')
            ]);

            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480, facingMode: "user" } 
            });
            video.srcObject = stream;

            video.onloadedmetadata = () => {
                btn.disabled = false;
                btn.textContent = "Start Face Scan";
                status.textContent = "Biometric system ready.";
            };
        } catch (err) {
            status.textContent = "Hardware error: Camera not found.";
            status.classList.add('error');
        }
    }

    btn.addEventListener('click', async () => {
        const brightness = getBrightness();

        if (brightness < 60) {
            status.textContent = "Increase brightness for better scan";
            status.classList.add('error');
            return;
        }
        btn.disabled = true;
        status.textContent = "Scanning features... Hold steady.";
        status.className = "status-box";

        const detection = await faceapi.detectSingleFace(video, detectorOptions)
                                        .withFaceLandmarks()
                                        .withFaceDescriptor();

        if (!detection) {
            status.textContent = "Scan failed. Face not detected.";
            status.className = "status-box error";
            btn.disabled = false;
            return;
        }

        try {
            const response = await fetch('/api/face/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ descriptor: Array.from(detection.descriptor) })
            });

            const result = await response.json();
            if (result.success) {
                status.textContent = "Biometric ID Registered!";
                status.className = "status-box success";
                btn.textContent = "Success ✓";
                setTimeout(() => window.location.href = result.redirect || '/signin', 2000);
            } else {
                status.textContent = result.message || "Encryption failed.";
                status.className = "status-box error";
                btn.disabled = false;
            }
        } catch (err) {
            status.textContent = "Network error. Try again.";
            status.className = "status-box error";
            btn.disabled = false;
        }
    });

    window.onload = setupRegistration;
</script>
</body>
</html>
