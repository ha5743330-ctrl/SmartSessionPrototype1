<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Registration | SmartSession</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --primary: #4a90e2; --success: #2ecc71; --error: #e74c3c; --dark: #2c3e50; }
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        #video-container { position: relative; width: 320px; height: 320px; margin: 20px auto; border-radius: 50%; overflow: hidden; border: 5px solid var(--primary); background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .status-box { margin: 15px 0; padding: 10px; border-radius: 8px; font-size: 14px; min-height: 20px; background: #f1f3f5; }
        .btn-register { background: var(--primary); color: white; border: none; padding: 14px 30px; border-radius: 30px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-register:disabled { background: #cbd5e0; cursor: not-allowed; }
        .error { color: var(--error); background: #fff5f5; border: 1px solid var(--error); }
        .success { color: var(--success); background: #f0fff4; border: 1px solid var(--success); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: var(--dark);">Register Face</h2>
    <p style="color: #718096; font-size: 14px;">Secure your account using Face ID</p>
    
    <div id="video-container">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="status" class="status-box">Initialising AI Models...</div>
    <button id="register-btn" class="btn-register" disabled>Please Wait...</button>
</div>

<script>
    const video = document.getElementById('video');
    const btn = document.getElementById('register-btn');
    const status = document.getElementById('status');

    // Production settings for accuracy
    const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.6 });

    async function setupRegistration() {
        try {
            // Loading models from your local path
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/models')
            ]);

            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480, facingMode: "user" } 
            });
            video.srcObject = stream;

            video.onloadedmetadata = () => {
                btn.disabled = false;
                btn.textContent = "Capture & Save Face";
                status.textContent = "System Ready. Please look at the camera.";
            };
        } catch (err) {
            status.textContent = "Camera access or model loading failed.";
            status.classList.add('error');
            console.error(err);
        }
    }

    btn.addEventListener('click', async () => {
        btn.disabled = true;
        status.textContent = "Processing features... Hold still.";
        status.className = "status-box";

        // Detect face with landmarks and descriptor
        const detection = await faceapi.detectSingleFace(video, detectorOptions)
                                        .withFaceLandmarks()
                                        .withFaceDescriptor();

        if (!detection) {
            status.textContent = "Face not detected. Ensure face is centered and clear.";
            status.classList.add('error');
            btn.disabled = false;
            return;
        }

        try {
            const response = await fetch('/api/face/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    descriptor: Array.from(detection.descriptor) 
                })
            });

            const result = await response.json();

            if (result.success) {
                status.textContent = "Face Registered Successfully!";
                status.className = "status-box success";
                setTimeout(() => window.location.href = result.redirect || '/signin', 2000);
            } else {
                status.textContent = result.message || "Registration failed.";
                status.classList.add('error');
                btn.disabled = false;
            }
        } catch (err) {
            status.textContent = "Server connection lost. Try again.";
            status.classList.add('error');
            btn.disabled = false;
        }
    });

    window.onload = setupRegistration;
</script>
</body>
</html>
