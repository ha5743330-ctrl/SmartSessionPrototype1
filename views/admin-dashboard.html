<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSession | Enterprise Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        :root {
            --bg-deep: #020617;
            --card-dark: #0f172a;
            --border-color: #1e293b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        :root {
    /* Ngrok Signature Palette */
    --bg-dark: #000000;          /* Pitch Black */
    --nav-navy: #0a0a0a;         /* Card background */
    --accent-blue: #3291ff;      /* Ngrok Blue (Red ki jagah blue zyada suit karega) */
    --text-main: #ffffff;
    --text-muted: #888888;
    --border: #1f1f1f;           /* Subtle dark borders */
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    padding-top: 80px;
    overflow-x: hidden;
    /* Purani image hata di gayi hai */
}
/* Radiant Glow like Ngrok dashboard */
body::after {
    content: "";
    position: fixed;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(circle, rgba(50, 145, 255, 0.1) 0%, transparent 70%);
    z-index: -1;
    filter: blur(50px);
    pointer-events: none;
}

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        /* Sidebar & Layout */
        .admin-wrapper { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 280px;
            background: var(--card-dark);
            border-right: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            position: fixed;
            height: 100vh;
        }

        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 2rem;
        }

        /* UI Components */
        .glass-card {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        /* Tables */
        .table-container {
            border-radius: 12px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            background: transparent !important;
        }

        .custom-table thead th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 1rem;
            border: none;
        }

        .custom-table tbody tr {
            background-color: rgba(30, 41, 59, 0.5);
            transition: transform 0.2s;
        }

        .custom-table tbody tr:hover {
            background-color: rgba(30, 41, 59, 1);
            transform: scale(1.005);
        }

        .custom-table td {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        /* Status Badges */
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-blocked { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        /* Search & Filters */
        .search-box {
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            width: 300px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Loader */
        .shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #1e293b 4%, #334155 25%, #1e293b 36%);
            background-size: 1000px 100%;
        }

        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); transition: 0.3s; z-index: 1000; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <aside class="sidebar">
        <div class="d-flex align-items-center mb-5">
            <div class="stat-icon bg-primary me-3 mb-0">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h4 class="mb-0 fw-bold">AdminPro</h4>
        </div>
        
        <div class="nav flex-column gap-2">
            <a href="#" class="nav-link text-white bg-primary rounded-3 p-3">
                <i class="fas fa-chart-pie me-3"></i> Overview
            </a>
            <a href="#" class="nav-link text-muted p-3">
                <i class="fas fa-users me-3"></i> User Directory
            </a>
            <a href="#" class="nav-link text-muted p-3">
                <i class="fas fa-file-invoice me-3"></i> Audit Logs
            </a>
            <a href="#" class="nav-link text-muted p-3">
                <i class="fas fa-cog me-3"></i> System Settings
            </a>
            <hr class="text-muted my-4">
            <button class="btn btn-outline-danger w-100" id="logoutBtn">
                <i class="fas fa-sign-out-alt me-2"></i> Terminate Session
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold mb-1">Infrastructure Control</h2>
                <p class="text-muted">Real-time system monitoring and user governance.</p>
            </div>
            <div class="d-flex gap-3">
                <input type="text" id="globalSearch" class="search-box" placeholder="Search users, emails, roles...">
                <button class="btn btn-primary px-4" id="refreshAll">
                    <i class="fas fa-sync-alt me-2"></i> Sync
                </button>
            </div>
        </header>

        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="glass-card">
                    <div class="stat-icon bg-info bg-opacity-10 text-info">
                        <i class="fas fa-user-group"></i>
                    </div>
                    <p class="text-muted small fw-bold mb-1">TOTAL USERS</p>
                    <h3 class="fw-bold" id="stat-total-users">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card border-success">
                    <div class="stat-icon bg-success bg-opacity-10 text-success">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <p class="text-muted small fw-bold mb-1">ACTIVE ACCOUNTS</p>
                    <h3 class="fw-bold" id="stat-active-users">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card border-danger">
                    <div class="stat-icon bg-danger bg-opacity-10 text-danger">
                        <i class="fas fa-user-slash"></i>
                    </div>
                    <p class="text-muted small fw-bold mb-1">RESTRICTED</p>
                    <h3 class="fw-bold" id="stat-blocked-users">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card">
                    <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <p class="text-muted small fw-bold mb-1">SYSTEM UPTIME</p>
                    <h3 class="fw-bold">99.9%</h3>
                </div>
            </div>
        </div>

        <div class="glass-card mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">User Registry</h4>
                <div class="btn-group">
                    <button class="btn btn-outline-secondary btn-sm active" onclick="filterData('all')">All</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="filterData('admin')">Admins</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="filterData('user')">Members</button>
                </div>
            </div>
            
            <div class="table-container">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>IDENTIFIER</th>
                            <th>ROLE</th>
                            <th>LATEST ACTIVITY</th>
                            <th>STATUS</th>
                            <th class="text-end">OPERATIONS</th>
                        </tr>
                    </thead>
                    <tbody id="usersMasterTable">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="glass-card">
                    <h4 class="fw-bold mb-4">System Audit Trail</h4>
                    <div id="auditLog" class="list-group list-group-flush bg-transparent">
                        </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // Ngrok-style interactive background
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    
    // Grid position ko halka sa shift karna
    document.body.style.backgroundPosition = `${x * 0.05}px ${y * 0.05}px`;
});
    const apiBase = window.location.origin;
    let globalUsers = [];
    let auditLogs = [];

    /**
     * CORE INITIALIZATION
     */
    async function initializeDashboard() {
        console.log("⚡ System Core Initializing...");
        await fetchMasterData();
        setupEventListeners();
    }

    /**
     * DATA FETCHING ENGINE
     */
    async function fetchMasterData() {
        showTableLoading(true);
        try {
            const [userRes, reportRes] = await Promise.all([
                axios.get(`${apiBase}/api/admin/users`),
                axios.get(`${apiBase}/api/reports`)
            ]);

            globalUsers = userRes.data;
            auditLogs = reportRes.data;

            renderStatistics();
            renderUsers(globalUsers);
            renderAuditLogs();
        } catch (err) {
            triggerNotification('Critical System Error: Database Sync Failed', 'error');
            console.error(err);
        } finally {
            showTableLoading(false);
        }
    }

    /**
     * UI RENDERING ENGINE
     */
    function renderStatistics() {
        document.getElementById('stat-total-users').innerText = globalUsers.length;
        document.getElementById('stat-active-users').innerText = globalUsers.filter(u => !u.blocked).length;
        document.getElementById('stat-blocked-users').innerText = globalUsers.filter(u => u.blocked).length;
    }

    function renderUsers(data) {
        const tableBody = document.getElementById('usersMasterTable');
        tableBody.innerHTML = '';

        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">No records matching your search criteria.</td></tr>';
            return;
        }

        data.forEach(user => {
            const isAdmin = user.role === 'admin';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="d-flex align-items-center">
                        <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px; font-size: 12px;">
                            ${user.name.charAt(0)}
                        </div>
                        <div>
                            <div class="fw-bold">${user.name}</div>
                            <div class="text-muted x-small" style="font-size: 11px;">${user.email}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="badge ${isAdmin ? 'bg-primary' : 'bg-dark'} border border-secondary">${user.role.toUpperCase()}</span>
                </td>
                <td class="text-muted small">
                    ${new Date(user.updatedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}
                </td>
                <td>
                    <span class="status-badge ${user.blocked ? 'status-blocked' : 'status-active'}">
                        ${user.blocked ? 'RESTRICTED' : 'OPERATIONAL'}
                    </span>
                </td>
                <td class="text-end">
                    ${isAdmin ? '<i class="fas fa-lock text-muted mx-3" title="System Root"></i>' : `
                        <div class="btn-group gap-2">
                            <button class="btn btn-outline-${user.blocked ? 'success' : 'warning'} btn-sm px-3" 
                                onclick="${user.blocked ? 'handleUnblock' : 'handleBlock'}('${user._id}')">
                                <i class="fas ${user.blocked ? 'fa-user-check' : 'fa-user-slash'}"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm px-3" onclick="handleDelete('${user._id}')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `}
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function renderAuditLogs() {
        const logContainer = document.getElementById('auditLog');
        logContainer.innerHTML = '';

        auditLogs.slice(0, 8).forEach(log => {
            const div = document.createElement('div');
            div.className = 'list-group-item bg-transparent border-0 px-0 mb-3';
            div.innerHTML = `
                <div class="d-flex justify-content-between">
                    <div class="d-flex gap-3">
                        <div class="stat-icon bg-dark border border-secondary rounded-circle" style="width:35px; height:35px; font-size: 12px; margin:0">
                            <i class="fas fa-history"></i>
                        </div>
                        <div>
                            <p class="mb-0 fw-bold small">${log.user?.name || 'System'}: <span class="text-info fw-normal">${log.action}</span></p>
                            <small class="text-muted" style="font-size: 10px;">${new Date(log.createdAt).toLocaleString()}</small>
                        </div>
                    </div>
                    <span class="badge bg-dark text-muted">LOG_ID: ${log._id.substr(-6)}</span>
                </div>
            `;
            logContainer.appendChild(div);
        });
    }

    /**
     * ACTIONS ENGINE
     */
    async function handleBlock(id) {
        if(!confirm('Restricting this user will terminate their active sessions. Proceed?')) return;
        try {
            await axios.put(`${apiBase}/api/admin/block-user/${id}`);
            await fetchMasterData();
            triggerNotification('Protocol Executed: User Restricted', 'success');
        } catch(err) { triggerNotification('Authorization Failure', 'error'); }
    }

    async function handleUnblock(id) {
        try {
            await axios.put(`${apiBase}/api/admin/unblock-user/${id}`);
            await fetchMasterData();
            triggerNotification('User restored to operational status', 'success');
        } catch(err) { triggerNotification('Server override failed', 'error'); }
    }

    async function handleDelete(id) {
        const u = globalUsers.find(x => x._id === id);
        if(u.role === 'admin') return;
        
        if(!confirm(`PERMANENT DELETION: Are you sure you want to scrub ${u.name} from the database?`)) return;
        
        try {
            await axios.delete(`${apiBase}/api/admin/delete-user/${id}`);
            await fetchMasterData();
            triggerNotification('User account scrubbed successfully', 'success');
        } catch(err) { triggerNotification('Deletion protocol failed', 'error'); }
    }

    /**
     * UTILITIES & LISTENERS
     */
    function setupEventListeners() {
        // Search Filter
        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = globalUsers.filter(u => 
                u.name.toLowerCase().includes(term) || 
                u.email.toLowerCase().includes(term) ||
                u.role.toLowerCase().includes(term)
            );
            renderUsers(filtered);
        });

        // Sync Button
        document.getElementById('refreshAll').addEventListener('click', fetchMasterData);

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await axios.post(`${apiBase}/api/logout`);
            window.location.href = '/signin';
        });
    }

    function triggerNotification(msg, type) {
        // Professional Alert System
        const toast = document.createElement('div');
        toast.className = `position-fixed bottom-0 end-0 m-4 p-3 rounded-3 shadow text-white ${type === 'success' ? 'bg-success' : 'bg-danger'}`;
        toast.style.zIndex = "9999";
        toast.innerHTML = `<i class="fas fa-info-circle me-2"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function showTableLoading(status) {
        const table = document.getElementById('usersMasterTable');
        if(status) {
            table.innerHTML = '<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>';
        }
    }

    // Startup
    initializeDashboard();
</script>

</body>
</html>
