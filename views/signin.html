<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSession | Sign In / Register</title>
    <link rel="stylesheet" href="/style.css">

  <style>
:root {
    /* Ngrok & Modern Dark Palette */
    --bg-black: #000000;
    --card-bg: #0a0a0a;
    --accent-blue: #3291ff;
    --border-color: #1f1f23;
    --text-main: #f8fafc;
    --text-muted: #888888;
}

body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background-color: var(--bg-black);
    color: var(--text-main);
    
    /* --- Perfect Centering & Layout --- */
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    
    overflow: hidden; /* Scrollbars hata diye professional look ke liye */
    position: relative;
}

/* Ngrok Style Grid Background */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Subtle 45px grid pattern */
    background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: radial-gradient(circle at center, black, transparent 85%);
    pointer-events: none;
    z-index: -1;
}

/* Subtle Blue Glow at the top */
body::after {
    content: "";
    position: absolute;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(circle, rgba(50, 145, 255, 0.1) 0%, transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    z-index: -1;
}

/* Card centering and polish */
.auth-container, .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 40px;
    width: 90%;
    max-width: 400px; /* Card ko center mein compact rakhne ke liye */
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    z-index: 10;
    transition: transform 0.3s ease, border-color 0.3s ease;
}

/* Input Fields Polish */
input {
    width: 100%;
    background: #111111;
    border: 1px solid var(--border-color);
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    box-sizing: border-box; /* Centering align karne ke liye zaroori hai */
    margin-bottom: 20px;
}

input:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(50, 145, 255, 0.1);
}

     /* ---------- NAVBAR ---------- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }

.logo {
  display: flex;
  align-items: center; /* vertically center */
  gap: 8px; /* text aur image ke beech spacing */
}

.logo-img {
  height: 40px; /* apni requirement ke mutabiq adjust karein */
  width: auto;
}


    nav ul {
      list-style: none;
      display: flex;
      margin: 0px 40px 0px 0px;
      padding: 0;
      transition: all 0.3s ease;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: #101699;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
    }

    /* --- Hamburger icon --- */
    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 25px;
      height: 20px;
      justify-content: space-between;
    }

    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }


    /* Form */
    .container {
      z-index: 2;
      width: 380px;
      margin-top: 200px;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffaa;
      clip-path: polygon(0 0, 100% 10%, 95% 100%, 5% 95%);
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }

    .tabs button {
      background: transparent;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      padding: 8px 20px;
      transition: 0.3s;
    }

    .tabs button.active {
      border-bottom: 2px solid #00ffcc;
      color: #00ffcc;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

.btn.anydesk-btn {
  position: relative;
  padding: 14px 40px;
  font-size: 16px;
  border-radius: 8px;
  text-decoration: none;
  color: #ffffff;
  background: #720202; /* AnyDesk signature red */
  border: none;
  display: block;          /* change from inline-block */
  cursor: pointer;
  overflow: hidden;
  transition: background 0.2s ease;
  margin: 20px auto;       /* center button */
}


.btn.anydesk-btn:hover {
  background: #720202; /* thoda darker on hover */
}

.btn.anydesk-btn::before {
  content: "";
  position: absolute;
  top: var(--y);
  left: var(--x);
  width: 180px;
  height: 180px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgb(86, 207, 6), transparent 60%);
  opacity: 0;
  border-radius: 50%;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}

.btn.anydesk-btn:hover::before {
  opacity: 0.6;
}



    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

        footer {
  margin-top: auto;
  width: 100%;
  background: rgba(0,0,0,0.6);
  padding: 15px;
  text-align: center;
  color: white;
  font-size: 14px;
}

    /* ---------- Responsive Styles ---------- */
    @media (max-width: 900px) {
      nav ul {
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
      }

      nav ul.active {
        max-height: 500px;
        padding: 10px 0;
      }

      nav ul li {
        margin: 15px 0;
      }

      .menu-icon {
        display: flex;
        margin: 0px 40px 0px 0px;
      }
    }

    /* --- Animation for menu open/close --- */
    .menu-icon.active div:nth-child(1) {
      transform: rotate(45deg) translateY(8px);
    }
    .menu-icon.active div:nth-child(2) {
      opacity: 0;
    }
    .menu-icon.active div:nth-child(3) {
      transform: rotate(-45deg) translateY(-8px);
    }
    nav ul li a:hover, nav ul li a.active { color: var(--white); border-bottom: 2px solid var(--accent-red); }
/* --- Glass Mode Active Styles --- */
body.glass-enabled nav, 
body.glass-enabled #top-header {
  background: rgba(255, 255, 255, 0.1) !important;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
}

/* Glass mode mein links ka color white karna zaroori hai */
body.glass-enabled nav ul li a {
  color: #ffffff !important;
}

body.glass-enabled .menu-icon div {
  background-color: #ffffff; /* Mobile menu icon color in glass mode */
}

/* --- Toggle Switch Styling --- */
.glass-toggle-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  margin-right: 20px;
  z-index: 100;
}

.glass-label {
  font-size: 10px;
  font-weight: bold;
  color: #101699;
  letter-spacing: 1px;
}

body.glass-enabled .glass-label { color: #00ffcc; }

.switch-container {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 20px;
}

.switch-container input { opacity: 0; width: 0; height: 0; }

.slider-round {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 34px;
}

.slider-round:before {
  position: absolute;
  content: "";
  height: 14px; width: 14px;
  left: 3px; bottom: 3px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider-round { background-color: #00ffcc; }
input:checked + .slider-round:before { transform: translateX(18px); }

/* Padding fix taake content hide na ho */
.hero, main {
  padding-top: 100px !important;
}

@media (max-width: 900px) {
  .glass-toggle-wrapper { margin-right: 15px; }
}

</head>

<body>


    <!-- Navbar -->
  <nav>
  <div class="logo">
    <img src="/images/logo1.png" class="logo-img">
  </div>

  <!-- Single Toggle Button for Both -->
  <div class="glass-toggle-wrapper">
    <span class="glass-label"></span>
    <label class="switch-container">
      <input type="checkbox" id="mainGlassToggle">
      <span class="slider-round"></span>
    </label>
  </div>

  <div class="menu-icon" id="menu-icon">
    <div></div><div></div><div></div>
  </div>
  
  <ul id="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/signin">Sign In</a></li>
    <li><a href="/create-session">Start Session</a></li>
    <li><a href="/join-session">Join Session</a></li>
    <li><a href="/view-sessions">View Sessions</a></li>
    <li><a href="/reports">Reports</a></li>
    <li><a href="/settings" class="nav-settings">Settings</a></li>
    <li><a href="#" id="logoutBtn">Logout</a></li>
  </ul>
</nav>
  <!-- Form -->
  <div class="container">
    <div class="form-box">
      <div class="tabs">
        <button id="loginTab" class="active" onclick="showForm('login')">Sign In</button>
        <button id="registerTab" onclick="showForm('register')">Create Account</button>
      </div>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="btn anydesk-btn">Login</button>
      </form>

      <form id="registerForm" style="display: none;">
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <button type="submit" class="btn anydesk-btn">Create Account</button>
      </form>
    </div>
    
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 SmartSession Management | All Rights Reserved</p>
  </footer>
<!-- <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script> -->

<script>
  // HTML mein <body> ke foran baad ye div add karein: <div id="grid-bg"></div>

document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('grid-bg');
    
    document.addEventListener('mousemove', (e) => {
        // Mouse coordinates calculate karein
        const mouseX = e.clientX / window.innerWidth;
        const mouseY = e.clientY / window.innerHeight;

        // Grid ko mouse ke opposite direction mein halka sa move karein
        const moveX = (mouseX - 0.5) * 30; // 30px tak ki movement
        const moveY = (mouseY - 0.5) * 30;

        // Transform apply karein
        if (grid) {
            grid.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }
    });
});
    // tsparticles
  // tsParticles.load("tsparticles", {
  //   background: { color: "#02022A" },
  //   particles: {
  //     number: { value: 10 },
  //     size: { value: 80 },
  //     opacity: { value: 0.15 },
  //     shape: { type: "circle" },
  //     move: { enable: false }
  //   }
  // });
  // --- Mobile Menu Toggle ---
// Master Toggle for Glass Mode
const mainGlassToggle = document.getElementById('mainGlassToggle');

mainGlassToggle.addEventListener('change', function() {
    if (this.checked) {
        document.body.classList.add('glass-enabled');
    } else {
        document.body.classList.remove('glass-enabled');
    }
});

// Aapka existing Menu Icon aur Logout code yahan niche rahega...
const menuIcon = document.getElementById('menu-icon');
const navLinks = document.getElementById('nav-links');
menuIcon.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    menuIcon.classList.toggle('active');
});

  // Show login/register form
  function showForm(form) {
    const isLogin = form === 'login';
    document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
    document.getElementById('loginTab').classList.toggle('active', isLogin);
    document.getElementById('registerTab').classList.toggle('active', !isLogin);
  }

  // ✅ REGISTER (FIXED – FACE AUTH REDIRECT)
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: regName.value,
        email: regEmail.value,
        password: regPassword.value
      })
    });

    const data = await res.json();
    alert(data.message || "Account created");

    // 🔥 IMPORTANT FIX
    if (data.success && data.redirect) {
      window.location.href = data.redirect; // → /face-auth
    }
  });
  // btn hover effect
  document.querySelectorAll(".btn.anydesk-btn").forEach(btn => {
    btn.addEventListener("mousemove", (e) => {
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      btn.style.setProperty("--x", x + "px");
      btn.style.setProperty("--y", y + "px");
    });
    btn.addEventListener("mouseleave", () => {
      btn.style.setProperty("--x", "50%");
      btn.style.setProperty("--y", "50%");
    });
  });
// ✅ LOGIN (MODIFIED FOR ROLE-BASED ALERTS)
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: loginEmail.value,
                password: loginPassword.value
            })
        });

        const data = await res.json();

        if (data.success) {
            // Check karein ke redirect path kya hai ya user role kya hai
            if (data.redirect === '/admin-dashboard') {
                alert("🛡️ Admin Login Successful! Welcome to Control Panel.");
            } else {
                alert("👤 Login Successful! Please verify your face to proceed.");
            }

            // Thora sa delay taake user alert parh sakay
            setTimeout(() => {
                window.location.href = data.redirect;
            }, 500);
            
        } else {
            alert(data.message || "Invalid credentials");
        }
    } catch (err) {
        console.error("Login Error:", err);
        alert("System connection error. Please try again later.");
    }
});
  
  
// --- 8. Logout & Navbar ---
document.getElementById("logoutBtn").onclick = async () => {
    // Confirmation Dialog
    const confirmLogout = confirm("Are you sure you want to log out? Any unsaved progress might be lost.");

    if (confirmLogout) {
        try {
            const response = await fetch("/api/logout", { method: "POST" });
            
            if (response.ok) {
                // Logout successful
                window.location.href = "/";
            } else {
                alert("Logout failed. Please try again.");
            }
        } catch (error) {
            console.error("Logout Error:", error);
            alert("Connection error. Could not log out.");
        }
    } else {
        // Agar user 'Cancel' click kare
        console.log("Logout cancelled by user.");
    }
};
</script>


</body>
