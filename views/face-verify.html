<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identity Check | SmartSession Security</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #8b5cf6;
    --primary-glow: rgba(139, 92, 246, 0.4);
    --success: #10b981;
    --error: #f43f5e;
    --bg: #020617;
    --glass: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
}

:root {
    /* Ngrok inspired dark theme palette */
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.5);
    --success: #10b981;
    --error: #ef4444;
    --bg: #000000; /* Ngrok jaisa pitch black */
    --card-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08); /* Subtle border */
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    position: relative;
}

/* Ngrok Style Grid Background */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 40px linear grid pattern */
    background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black, transparent 80%);
    pointer-events: none;
    z-index: -1;
}

/* Radiant glow at the top for depth */
body::after {
    content: "";
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
}

/* Card glass effect ko ngrok vibes ke liye thoda clean kiya hai */
.auth-container, .card {
    background: #0a0a0a; /* Deep dark grey/black */
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    z-index: 1; /* Center mein content upar dikhe */
}

.container {
    background: var(--glass);
    backdrop-filter: blur(25px);
    padding: 40px;
    border-radius: 32px;
    border: 1px solid var(--border);
    box-shadow: 0 40px 100px -20px rgba(0,0,0,0.7);
    width: 100%;
    max-width: 400px;
    text-align: center;
}

h2 {
    font-family: 'Outfit', sans-serif;
}

.scan-area {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 30px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
}

#video-container {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 18px;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

.laser {
    position: absolute;
    width: 100%;
    height: 2px;
    background: var(--primary);
    box-shadow: 0 0 15px var(--primary);
    animation: scan 3s infinite;
    display: none;
}

@keyframes scan {
    0% { top: 5%; }
    50% { top: 95%; }
    100% { top: 5%; }
}

.status-pill {
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 13px;
    margin-bottom: 20px;
    display: inline-block;
    border: 1px solid var(--border);
    color: #cbd5e1;
}

.status-pill.active { color: var(--primary); }
.status-pill.error { color: var(--error); }
.status-pill.success { color: var(--success); }

.btn-verify {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(135deg,#8b5cf6,#6d28d9);
    color: white;
}

.btn-verify:disabled {
    background: #1e293b;
    cursor: not-allowed;
}
</style>
</head>

<body>

<div class="glow-top"></div>

<div class="container">

<h2>Identity Check</h2>
<p>Authentication required</p>

<div class="scan-area">
    <div class="laser" id="laser"></div>
    <div id="video-container">
        <video id="video" autoplay muted playsinline></video>
    </div>
</div>

<div id="message" class="status-pill">Loading Models...</div>

<button id="verify-btn" class="btn-verify" disabled>Initialize Camera</button>

</div>

<script>

const video = document.getElementById("video");
const btn = document.getElementById("verify-btn");
const msg = document.getElementById("message");
const laser = document.getElementById("laser");
    // Ngrok-style interactive background
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    
    // Grid position ko halka sa shift karna
    document.body.style.backgroundPosition = `${x * 0.05}px ${y * 0.05}px`;
});
/* ---------------- BRIGHTNESS CHECK ---------------- */
function getBrightness() {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;

    let sum = 0;

    for (let i = 0; i < data.length; i += 4) {
        sum += (data[i] + data[i+1] + data[i+2]) / 3;
    }

    return sum / (data.length / 4);
}

/* ---------------- INIT ---------------- */
async function init() {
    try {
        await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
            faceapi.nets.faceLandmark68Net.loadFromUri('/models'),
            faceapi.nets.faceRecognitionNet.loadFromUri('/models')
        ]);

        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
            btn.disabled = false;
            btn.innerText = "Start Verification";
            msg.innerText = "System Ready";
            msg.classList.add("active");
        };

    } catch (e) {
        msg.innerText = "Camera / Model Error";
        msg.classList.add("error");
    }
}

/* ---------------- LIVE FACE CHECK ---------------- */
async function detectFace() {
    const detection = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

    return detection;
}

/* ---------------- CLICK ---------------- */
btn.addEventListener("click", async () => {

    // 🔴 Brightness Check FIRST
    const brightness = getBrightness();

    if (brightness < 60) {
        msg.innerText = "Please increase your brightness";
        msg.className = "status-pill error";
        return;
    }

    btn.disabled = true;
    msg.innerText = "Scanning Face...";
    laser.style.display = "block";

    const detection = await detectFace();

    if (!detection) {
        msg.innerText = "Face Not Detected Properly";
        msg.className = "status-pill error";
        laser.style.display = "none";
        btn.disabled = false;
        return;
    }

    try {
        const res = await fetch("/api/face/verify", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                liveDescriptor: Array.from(detection.descriptor)
            })
        });

        const data = await res.json();

        if (data.success) {
            msg.innerText = "Access Granted";
            msg.className = "status-pill success";
            laser.style.borderColor = "var(--success)";

            setTimeout(()=>window.location.href="/",1500);

        } else {
            msg.innerText = "Access Denied";
            msg.className = "status-pill error";
            laser.style.display = "none";
            btn.disabled = false;
        }

    } catch (e) {
        msg.innerText = "Server Error";
        msg.className = "status-pill error";
        laser.style.display = "none";
        btn.disabled = false;
    }
});

window.onload = init;
</script>

</body>
</html>
