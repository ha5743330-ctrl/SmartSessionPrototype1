<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Smart Session</title>
  <link rel="stylesheet" href="/style.css">

  <style>
/* SAME DESIGN YOU PROVIDED */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-image: url('/images/report-background.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: rgba(0,0,0,0.5);
  background-blend-mode: overlay;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgb(255, 255, 255);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(10px);
  z-index: 10;
  box-shadow: 0 0 15px rgba(0,255,255,0.3);
}
.logo { display: flex; align-items: center; gap: 8px; }
.logo-img { height: 40px; width: auto; }
nav ul { list-style: none; display: flex; margin: 0px 40px 0px 0px; padding: 0; transition: 0.3s; }
nav ul li { margin: 0 15px; }
nav ul li a { color: #101699; text-decoration: none; font-weight: 500; transition: 0.3s; }
nav ul li a:hover { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
.menu-icon { display: none; flex-direction: column; cursor: pointer; width: 25px; height: 20px; justify-content: space-between; }
.menu-icon div { width: 100%; height: 3px; background-color: #101699; border-radius: 2px; transition: 0.3s; }

.container {
  z-index: 2;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 50px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  clip-path: polygon(0 0, 100% 10%, 95% 100%, 5% 95%);
  box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffaa;
  max-width: 700px;
  width: 90%;
  text-align: center;
  margin-top: 120px;
}
h1 { font-size: 40px; color: #00ffcc; margin-bottom: 20px; }
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 5px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  outline: none;
}
.btn-danger {
    background-color: #ff4d4f;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.btn-danger:hover {
    background-color: #ff7875;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 5px;
  background: linear-gradient(90deg,#f5f4f7,#ff0000);
  color: #000; font-weight:bold;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: linear-gradient(90deg,#00ffaa,#00e5ff);
  box-shadow: 0 0 15px #00ffcc;
}

#sessionCodeBox {
  display: none;
  background: rgba(0,0,0,0.5);
  padding: 20px;
  margin-top: 20px;
  border: 1px solid #00ffcc;
  border-radius: 10px;
}
video {
  width: 100%;
  max-height: 400px;
  margin-top: 15px;
  border: 1px solid #00ffcc;
  border-radius: 10px;
}
footer {
  width: 100%;
  background: rgba(0,0,0,0.7);
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 14px;
  margin-top: auto; /* magic line */
}


@media (max-width:900px) {
  .menu-icon { display:flex; margin-right:30px; }
  nav ul {
    position:absolute;
    top:65px; left:0;
    width:100%;
    background:rgba(0,0,0,0.9);
    flex-direction:column;
    align-items:center;
    max-height:0;
    overflow:hidden;
    transition:max-height 0.3s ease;
    box-shadow:0 8px 20px rgba(0,255,255,0.3);
  }
  nav ul.active { max-height:400px; padding:15px 0; }
  nav ul li { margin:15px 0; }
}
.menu-icon.active div:nth-child(1) { transform: rotate(45deg) translateY(8px); }
.menu-icon.active div:nth-child(2) { opacity: 0; }
.menu-icon.active div:nth-child(3) { transform: rotate(-45deg) translateY(-8px); }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">
      <img src="/images/logo1.png" class="logo-img">
    </div>

    <div class="menu-icon" id="menu-icon">
      <div></div><div></div><div></div>
    </div>

    <ul id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/signin">Sign In</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/join-session">Join Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <h1>Start a Smart Session</h1>

    <form id="createSessionForm">
      <input type="text" id="sessionName" placeholder="Enter Session Title" required>
      <button type="submit">Generate Session</button>
    </form>

    <div id="sessionCodeBox">
      <h3>Your Session Code:</h3>
      <p id="sessionCode" style="font-size:24px; color:#00ffcc; font-weight:bold;"></p>
      <p>Share this code to allow others to join.</p>
    </div>

    <video id="localVideo" autoplay playsinline muted></video>
      <!-- End Session Button -->
<button id="endSessionBtn" class="btn btn-danger">End Session</button>

  </div>



  <footer>
    <p>© 2025 SmartSession | All Rights Reserved</p>
  </footer>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/signaling.js"></script>

<script>
/* ---------------------------
   CREATE SESSION BUTTON
----------------------------*/
document.getElementById("createSessionForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const res = await fetch("/api/create-session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      sessionName: document.getElementById("sessionName").value
    })
  });

  const data = await res.json();

  if (!data.success) return alert("Error: " + data.message);

  document.getElementById("sessionCodeBox").style.display = "block";
  document.getElementById("sessionCode").innerText = data.sessionCode;

  window.createRoom(data.sessionCode);
});



/* ---------------------------
   NAV MENU
----------------------------*/
const menuIcon = document.getElementById("menu-icon");
const navLinks = document.getElementById("nav-links");

menuIcon.addEventListener("click", () => {
  navLinks.classList.toggle("active");
  menuIcon.classList.toggle("active");
});

/* ---------------------------
   LOGOUT
----------------------------*/
document.getElementById("logoutBtn").addEventListener("click", async () => {
  const res = await fetch("/api/logout", { method: "POST" });
  const data = await res.json();
  alert(data.message);
  window.location.href = "/";
});
const endSessionBtn = document.getElementById("endSessionBtn");
const socket = io(); // connect to server

// End Session Button Click
endSessionBtn.addEventListener("click", () => {
    if (confirm("Are you sure you want to end the session?")) {

        // 1️⃣ Stop local screen stream
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }

        // 2️⃣ Notify server that session ended
        socket.emit("endSession", { sessionCode }); // optional: send session code

        // 3️⃣ Hide session UI
        document.getElementById("sessionCodeBox").style.display = "none";
        document.getElementById("localVideo").srcObject = null;

        // 4️⃣ Redirect to home page after session ends
        alert("Session has ended!");
        window.location.href = "/";
    }
});

// Optional: Listen if server forcibly ends session for all participants
socket.on("sessionEnded", () => {
    alert("Host has ended the session!");
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    document.getElementById("localVideo").srcObject = null;
    window.location.href = "/";
});


// Listen for session ended from server
socket.on("sessionEnded", () => {
    alert("Session has been ended!");
    // Optionally redirect user back to home page
    window.location.href = "/";
});
socket.on("host-receive-control", ({ type, data }) => {
    if (type === "pointer-move") {
        // Ek chota red dot (div) create karein jo viewer ke mouse ke sath hile
        showLaserOnScreen(data.x, data.y);
    } 
    else if (type === "text-data") {
        // Text ko alert ya clipboard mein copy karwa dein
        alert("Viewer Sent: " + data.text);
        navigator.clipboard.writeText(data.text);
    }
});

function showLaserOnScreen(xRatio, yRatio) {
    let dot = document.getElementById("laser-dot");
    if (!dot) {
        dot = document.createElement("div");
        dot.id = "laser-dot";
        dot.style = "position:absolute; width:15px; height:15px; background:red; border-radius:50%; pointer-events:none; z-index:9999; box-shadow: 0 0 10px red;";
        document.body.appendChild(dot);
    }
    // Screen size ke mutabiq position set karein
    dot.style.left = (xRatio * window.innerWidth) + "px";
    dot.style.top = (yRatio * window.innerHeight) + "px";
    
    // 2 second baad gayab ho jaye
    setTimeout(() => dot.remove(), 2000);
}
// Host Side: Receive and Download File
socket.on("host-receive-control", ({ type, data }) => {
    if (type === "file-transfer") {
        const blob = new Blob([data.blob], { type: data.fileType });
        const url = window.URL.createObjectURL(blob);
        
        // Auto-download link create karna
        const a = document.createElement('a');
        a.href = url;
        a.download = data.fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();

        showToast("📁 File Received: " + data.fileName);
    }
    // ... baqi logic (laser, text etc.)
});

</script>

</body>
</html>
