



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Session Management</title>
 <link rel="stylesheet" href="/style.css">
 <style> 
 
 footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      border-top: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      z-index: 5;
    }
       /* ---------- NAVBAR ---------- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgb(255, 255, 255);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }

    nav .logo {
      font-size: 24px;
      font-weight: bold;
      color: #101699;
      text-shadow: 0 0 15px #00ffaa;
    }

    nav ul {
      list-style: none;
      display: flex;
      margin: 0px 40px 0px 0px;
      padding: 0;
      transition: all 0.3s ease;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: #101699;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
    }

    /* --- Hamburger icon --- */
    .menu-icon {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 25px;
      height: 20px;
      justify-content: space-between;
    }

    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: #101699;
      border-radius: 2px;
      transition: 0.3s;
    }
 </style>
<body>
  <header>
    <h1>Session Management</h1>
     <nav>
    <div class="logo">SmartSession</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/create-session">Start Session</a></li>
      <li><a href="/view-sessions">View Sessions</a></li>
      <li><a href="/reports">Reports</a></li>
      <li><a href="/signin">Sign In</a></li>
            <li><a href="/join-session">Join Session</a></li>

      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>
  </header>

  <main>
    <h2>Settings</h2>
    <form>
      <label for="username">Change Username:</label>
      <input type="text" id="username" name="username" placeholder="Enter new username">

      <br><br>

      <label for="password">Change Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter new password">

      <br><br>

      <button type="submit">Save Settings</button>
    </form>
  </main>
<script>
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const res = await fetch('/api/logout', { method: 'POST' });
    const data = await res.json();
    alert(data.message);
    window.location.href = '/create-session';
  });
</script>
   <!-- Footer -->
  <footer>
    <p>© 2025 SmartSession Management | All Rights Reserved</p>
  </footer>
</body>
</html>
